A":["digital-9","digital-10","digital-11","digital-12"],"mockB":["digital-13","digital-14","digital-15","digital-16"]}}],"questions":{"observe-1":{"id":"observe-1","topic":"observe","en":"Which body part helps you hear a bell?","zh":"哪个身体部位帮助你听铃声？","options":["Ears","Eyes","Nose"],"answer":0,"why":"Ears help us hear sounds.","whyZh":"耳朵帮助我们听声音。"},"observe-2":{"id":"observe-2","topic":"observe","en":"You want to measure the length of a pencil. Which tool should you use?","zh":"想测量铅笔长度，应该用哪个工具？","options":["Thermometer","Ruler","Magnifying glass"],"answer":1,"why":"A ruler measures length.","whyZh":"尺子用于测量长度。"},"observe-3":{"id":"observe-3","topic":"observe","en":"Which sentence is an observation?","zh":"哪一句是观察结果？","options":["This flower is the best.","This flower is pretty.","This flower has five petals."],"answer":2,"why":"An observation describes what you can notice or measure.","whyZh":"观察是描述你能看到或测量到的事实。"},"observe-4":{"id":"observe-4","topic":"observe","en":"Which tool helps you see tiny details on a leaf?","zh":"哪个工具能帮你看清叶子的微小细节？","options":["Magnifying glass","Ruler","Balance"],"answer":0,"why":"A magnifying glass makes tiny details appear larger.","whyZh":"放大镜能让细小细节看得更清楚。"},"observe-5":{"id":"observe-5","topic":"observe","en":"What do scientists make BEFORE doing a test?","zh":"科学家在实验前通常会做什么？","options":["A final conclusion","A prediction","A score"],"answer":1,"why":"A prediction is what you think will happen.","whyZh":"预测是你认为接下来会发生什么。"},"observe-6":{"id":"observe-6","topic":"observe","en":"Two towels are tested with different amounts of water. Is this a fair test?","zh":"两条纸巾使用不同水量测试，这算公平实验吗？","options":["Yes, always","Only if colors match","No, keep the water amount the same"],"answer":2,"why":"A fair comparison changes one thing at a time.","whyZh":"公平比较应尽量只改变一个条件。"},"observe-7":{"id":"observe-7","topic":"observe","en":"You find an unknown liquid. What is the safe choice?","zh":"发现一瓶不明液体，怎样做才安全？","options":["Do not taste it; ask an adult","Taste it quickly","Smell it closely"],"answer":0,"why":"Never taste unknown substances; ask a trusted adult.","whyZh":"不要尝试不明物质，应找可信任的成人。"},"observe-8":{"id":"observe-8","topic":"observe","en":"After a test, what should you do?","zh":"实验结束后应该做什么？","options":["Hide the results","Look at results and make a conclusion","Change your prediction to match a friend"],"answer":1,"why":"A conclusion explains what the evidence shows.","whyZh":"结论应根据实验观察和证据作出。"},"observe-9":{"id":"observe-9","topic":"observe","en":"Mia hears birds but cannot see them. Which sense gives her information?","zh":"Mia 听到鸟叫但没看到鸟，是哪种感官在提供信息？","options":["Sight","Taste","Hearing"],"answer":2,"why":"Hearing works even when the object is out of sight.","whyZh":"看不到物体时，也能通过听觉获取信息。"},"observe-10":{"id":"observe-10","topic":"observe","en":"Which sentence is a useful prediction?","zh":"哪一句是有用的预测？","options":["I think the ice will melt in the sun.","I like the sun the most.","The sun is yellow."],"answer":0,"why":"Predictions describe something that may happen.","whyZh":"预测描述可能发生的事情。"},"observe-11":{"id":"observe-11","topic":"observe","en":"You want to measure how hot the water is. Choose the tool.","zh":"想测量水有多热，应该用什么工具？","options":["Ruler","Thermometer","Magnifying glass"],"answer":1,"why":"Thermometers measure temperature; have an adult handle hot water.","whyZh":"温度计测温度；热水操作需要成人帮助。"},"observe-12":{"id":"observe-12","topic":"observe","en":"Which is a good way to share science results?","zh":"怎样分享实验结果比较好？","options":["Only say “I win!”","Make up numbers","Show what you measured and noticed"],"answer":2,"why":"Good scientists report their observations honestly.","whyZh":"科学家应诚实地报告观察结果。"},"observe-13":{"id":"observe-13","topic":"observe","en":"What sense helps you notice that lemon peel smells strong?","zh":"柠檬皮气味很浓，是哪种感官？","options":["Smell","Touch","Sight"],"answer":0,"why":"Your nose detects smells.","whyZh":"鼻子用来闻气味。"},"observe-14":{"id":"observe-14","topic":"observe","en":"A scientist wants to compare which toy rolls farther. What should stay the same?","zh":"比较玩具哪一个滚得更远，哪项条件应保持一致？","options":["The color of the toys","The slope used for each toy","The name of each toy"],"answer":1,"why":"Use the same slope to make the comparison fair.","whyZh":"使用相同斜坡，比较才更公平。"},"observe-15":{"id":"observe-15","topic":"observe","en":"Which question can be investigated by testing?","zh":"哪一个问题可以通过实验探究？","options":["Which color is nicest?","Who is the funniest?","Which paper absorbs more water?"],"answer":2,"why":"Absorption can be tested and measured.","whyZh":"吸水量可以通过实验观察和测量。"},"observe-16":{"id":"observe-16","topic":"observe","en":"After checking the results, your prediction was wrong. What should you do?","zh":"实验结果与你的预测不同，应该怎么办？","options":["Tell the truth and explain the results","Change the results","Never try again"],"answer":0,"why":"A wrong prediction is part of learning; evidence matters.","whyZh":"预测不正确也能学习，最重要是尊重证据。"},"materials-1":{"id":"materials-1","topic":"materials","en":"Which material comes directly from nature?","zh":"哪种材料直接来自大自然？","options":["Plastic","Cotton","Nylon"],"answer":1,"why":"Cotton comes from a plant.","whyZh":"棉花来自植物。"},"materials-2":{"id":"materials-2","topic":"materials","en":"Which material is human-made?","zh":"哪种材料是人造的？","options":["Stone","Wood","Plastic"],"answer":2,"why":"Plastic is made by people through manufacturing.","whyZh":"塑料由人类制造。"},"materials-3":{"id":"materials-3","topic":"materials","en":"What property is most useful for a raincoat?","zh":"雨衣最需要哪种特性？","options":["Waterproof","Absorbent","Heavy"],"answer":0,"why":"Waterproof materials help keep rain out.","whyZh":"防水材料可以挡雨。"},"materials-4":{"id":"materials-4","topic":"materials","en":"What does transparent mean?","zh":"“Transparent”是什么意思？","options":["Very heavy","You can see through it","Very soft"],"answer":1,"why":"Clear glass can be transparent.","whyZh":"透明玻璃可以透过去看东西。"},"materials-5":{"id":"materials-5","topic":"materials","en":"Which material is good for soaking up spilled water?","zh":"哪种材料适合吸掉洒出的水？","options":["Plastic sheet","Metal spoon","Towel"],"answer":2,"why":"An absorbent towel soaks up water.","whyZh":"吸水毛巾可以吸收水。"},"materials-6":{"id":"materials-6","topic":"materials","en":"Your paper bridge falls down. What should you do?","zh":"纸桥塌了，应该怎么做？","options":["Change the design and test again","Give up immediately","Hide the bridge"],"answer":0,"why":"Engineers test and improve their designs.","whyZh":"工程师会测试并改进设计。"},"materials-7":{"id":"materials-7","topic":"materials","en":"Which is the best reason to choose a material?","zh":"选择材料最好的理由是什么？","options":["It is my favorite color","It has properties that fit the job","My friend likes it"],"answer":1,"why":"Different jobs need different properties.","whyZh":"不同用途需要不同材料特性。"},"materials-8":{"id":"materials-8","topic":"materials","en":"Which object is usually made from wood?","zh":"哪个物品通常可用木材制作？","options":["Water","Cloud","Table"],"answer":2,"why":"Wood is a material often used for furniture.","whyZh":"木材常用于制作家具。"},"materials-9":{"id":"materials-9","topic":"materials","en":"You need a window you can see through. Which material works best?","zh":"需要一扇可以看穿的窗，哪种材料最好？","options":["Clear glass","Cardboard","Wood"],"answer":0,"why":"Transparent glass lets light pass and allows you to see through it.","whyZh":"透明玻璃可以透视。"},"materials-10":{"id":"materials-10","topic":"materials","en":"Which of these is a natural material?","zh":"以下哪个是天然材料？","options":["Plastic","Wool","Nylon"],"answer":1,"why":"Wool comes from animals such as sheep.","whyZh":"羊毛来自羊等动物。"},"materials-11":{"id":"materials-11","topic":"materials","en":"For a playground slide, what is important?","zh":"游乐场滑梯材料的重要要求是什么？","options":["It must dissolve in water","It must be sticky","It should be strong and smooth"],"answer":2,"why":"A strong, smooth surface helps a slide work safely.","whyZh":"结实、光滑的表面有助于安全滑行。"},"materials-12":{"id":"materials-12","topic":"materials","en":"What is the first step when solving a design problem?","zh":"解决设计问题时，首先应做什么？","options":["Understand the problem","Build without thinking","Ignore what is needed"],"answer":0,"why":"First understand what you need the design to do.","whyZh":"先明确设计需要解决的问题。"},"materials-13":{"id":"materials-13","topic":"materials","en":"What makes rubber useful for some bands?","zh":"橡胶为什么适合做一些橡皮筋？","options":["It is transparent","It can stretch","It is always hard"],"answer":1,"why":"Rubber is often elastic and can stretch.","whyZh":"橡胶通常有弹性，可以拉伸。"},"materials-14":{"id":"materials-14","topic":"materials","en":"What can help a weak paper tower stand better?","zh":"纸塔不稳，什么方法可能让它更稳固？","options":["Remove all the supports","Add water","Make a wider base"],"answer":2,"why":"A wider base can improve stability.","whyZh":"更宽的底座可能提高稳定性。"},"materials-15":{"id":"materials-15","topic":"materials","en":"Which is an example of testing a design?","zh":"哪一项属于测试设计？","options":["Put weight on a bridge model to see if it holds","Only draw a picture","Choose a name for the bridge"],"answer":0,"why":"Testing checks whether a design works.","whyZh":"测试能检查设计是否有效。"},"materials-16":{"id":"materials-16","topic":"materials","en":"Why might you use a metal spoon rather than paper to stir soup?","zh":"为什么搅拌汤一般用金属勺而不用纸勺？","options":["Metal is always soft","Metal holds its shape better when wet","Paper is waterproof"],"answer":1,"why":"Metal usually keeps its shape in water better than paper.","whyZh":"金属遇水通常比纸更能保持形状。"},"living-1":{"id":"living-1","topic":"living","en":"Which is a living thing?","zh":"哪个是生物？","options":["Rock","Pencil","Ant"],"answer":2,"why":"An ant is an animal and a living thing.","whyZh":"蚂蚁是动物，属于生物。"},"living-2":{"id":"living-2","topic":"living","en":"Which is nonliving?","zh":"哪个是非生物？","options":["Stone","Tree","Butterfly"],"answer":0,"why":"A stone does not carry out life processes.","whyZh":"石头不会进行生命活动。"},"living-3":{"id":"living-3","topic":"living","en":"What does a plant need to grow well?","zh":"植物要健康生长需要什么？","options":["Only toys","Water, air and light","Only books"],"answer":1,"why":"Plants need water, air and suitable light.","whyZh":"植物需要水、空气及适当的光照。"},"living-4":{"id":"living-4","topic":"living","en":"Which is a sign that a plant is living?","zh":"哪个现象说明植物有生命？","options":["It is green plastic","It is in a pot","It grows new leaves"],"answer":2,"why":"Growth is one sign of life.","whyZh":"生长是生命的特征之一。"},"living-5":{"id":"living-5","topic":"living","en":"A toy robot moves. Is it living?","zh":"玩具机器人能移动，它是生物吗？","options":["No, movement alone does not mean living","Yes, everything that moves is living","Only when it is blue"],"answer":0,"why":"A robot can move but does not grow or carry out life processes by itself.","whyZh":"机器人虽会移动，但不进行生命活动。"},"living-6":{"id":"living-6","topic":"living","en":"Which group contains only living things?","zh":"哪一组全部都是生物？","options":["Flower, stone, bee","Dog, tree, ant","Car, worm, book"],"answer":1,"why":"Dogs, trees and ants are all living things.","whyZh":"狗、树和蚂蚁都是生物。"},"living-7":{"id":"living-7","topic":"living","en":"Where might you find a fish living?","zh":"鱼通常生活在哪里？","options":["On a bookshelf","Inside a pencil case","In water"],"answer":2,"why":"Many fish live in water habitats.","whyZh":"许多鱼生活在水域中。"},"living-8":{"id":"living-8","topic":"living","en":"What is a good way to observe a small insect?","zh":"怎样观察小昆虫比较好？","options":["Look carefully without hurting it","Pull off its legs","Trap it in a hot box"],"answer":0,"why":"Observe living things gently and safely.","whyZh":"应温柔、安全地观察生物。"},"living-9":{"id":"living-9","topic":"living","en":"A tree cannot walk. Is it living?","zh":"树不能走路，它是不是生物？","options":["No, it cannot walk","Yes, it grows and needs resources","Only in summer"],"answer":1,"why":"Living things do not need to walk to be alive.","whyZh":"生物不一定能行走。"},"living-10":{"id":"living-10","topic":"living","en":"Which item was once part of a living thing but is now nonliving?","zh":"哪个物品来自曾经有生命的东西，但现在属于非生物？","options":["An ant","A growing seedling","A wooden desk"],"answer":2,"why":"Wood comes from trees, but a wooden desk is nonliving.","whyZh":"木桌来自树木，但木桌本身是非生物。"},"living-11":{"id":"living-11","topic":"living","en":"What do animals need to survive?","zh":"动物生存需要什么？","options":["Water, air and food","Only sunshine","Only a nest"],"answer":0,"why":"Animals need basic resources including water and food.","whyZh":"动物需要水、空气和食物等基本资源。"},"living-12":{"id":"living-12","topic":"living","en":"Which change is evidence that a seed is growing?","zh":"什么变化说明种子正在生长？","options":["It changes its name","A root comes out","The pot gets painted"],"answer":1,"why":"A sprouting root is part of growth.","whyZh":"长出根说明种子正在发芽生长。"},"living-13":{"id":"living-13","topic":"living","en":"Which pair has one living and one nonliving item?","zh":"哪一对包含一个生物和一个非生物？","options":["Dog and cat","Rock and chair","Flower and rock"],"answer":2,"why":"A flower is living, while a rock is nonliving.","whyZh":"花是生物，石头是非生物。"},"living-14":{"id":"living-14","topic":"living","en":"Why should a pet have clean drinking water?","zh":"为什么宠物需要干净的饮用水？","options":["Living things need water to stay healthy","Pets do not need water","Water is only for toys"],"answer":0,"why":"Water is essential for animals to live.","whyZh":"水是动物生存所必需的。"},"living-15":{"id":"living-15","topic":"living","en":"Which observation best shows a kitten is growing?","zh":"哪种观察最能说明小猫正在长大？","options":["It sleeps on a chair","It becomes bigger over time","Its toy changes color"],"answer":1,"why":"Increase in size over time is evidence of growth.","whyZh":"随着时间体型变大是生长的证据。"},"living-16":{"id":"living-16","topic":"living","en":"What is a habitat?","zh":"什么是“栖息地”？","options":["A science tool","A classroom rule","A place where a living thing lives"],"answer":2,"why":"A habitat is the place where an organism lives.","whyZh":"栖息地是生物生活的地方。"},"rules-1":{"id":"rules-1","topic":"rules","en":"Why do we have classroom rules?","zh":"为什么教室里要有规则？","options":["To make friends sad","To help everyone learn safely","To stop all fun"],"answer":1,"why":"Rules support safety, fairness and learning.","whyZh":"规则帮助大家安全、公平地学习。"},"rules-2":{"id":"rules-2","topic":"rules","en":"What should you do at a red traffic light?","zh":"遇到红色交通信号灯应该怎么做？","options":["Run","Dance","Stop"],"answer":2,"why":"A red traffic light tells road users to stop.","whyZh":"红灯表示停止。"},"rules-3":{"id":"rules-3","topic":"rules","en":"Which is a responsibility at school?","zh":"哪一项是学生在学校的责任？","options":["Keep the classroom tidy","Break others’ pencils","Shout during lessons"],"answer":0,"why":"Looking after shared spaces is responsible.","whyZh":"爱护公共空间是负责任的行为。"},"rules-4":{"id":"rules-4","topic":"rules","en":"What is a consequence?","zh":"“Consequence”是什么意思？","options":["A measuring tool","Something that happens because of a choice","A type of animal"],"answer":1,"why":"Our actions can lead to results or consequences.","whyZh":"我们的行为会带来结果或后果。"},"rules-5":{"id":"rules-5","topic":"rules","en":"Two classmates want the same toy. What is a fair choice?","zh":"两位同学想玩同一个玩具，怎样才公平？","options":["Grab it first","Hide the toy","Take turns"],"answer":2,"why":"Taking turns gives everyone a chance.","whyZh":"轮流玩让大家都有机会。"},"rules-6":{"id":"rules-6","topic":"rules","en":"You accidentally spill water. What should you do?","zh":"不小心洒了水，应该怎么做？","options":["Tell an adult and help clean it safely","Blame a friend","Run away"],"answer":0,"why":"Taking responsibility includes fixing mistakes safely.","whyZh":"承担责任包括安全地处理自己的失误。"},"rules-7":{"id":"rules-7","topic":"rules","en":"Which choice shows respect?","zh":"哪种行为体现尊重？","options":["Laugh when someone speaks","Listen without interrupting","Push to the front"],"answer":1,"why":"Respect means treating others kindly and listening.","whyZh":"尊重别人包括认真倾听。"},"rules-8":{"id":"rules-8","topic":"rules","en":"Why do people follow road safety laws?","zh":"为什么要遵守交通安全法规？","options":["For a game","To make roads busy","To protect people"],"answer":2,"why":"Safety laws help prevent harm.","whyZh":"安全法律帮助保护人们。"},"rules-9":{"id":"rules-9","topic":"rules","en":"You see a school rule that you do not understand. What should you do?","zh":"看到一条不理解的校规，应该怎么办？","options":["Ask the teacher politely","Ignore the rule","Tell everyone to break it"],"answer":0,"why":"Ask questions to understand a rule and its purpose.","whyZh":"可以礼貌询问老师，理解规则的目的。"},"rules-10":{"id":"rules-10","topic":"rules","en":"What might happen if you run on a wet floor?","zh":"在湿滑地板上奔跑可能会怎样？","options":["You always win","You might slip and get hurt","The floor becomes dry"],"answer":1,"why":"Unsafe choices may have harmful consequences.","whyZh":"不安全的行为可能导致受伤。"},"rules-11":{"id":"rules-11","topic":"rules","en":"Who should wear a seat belt in a car when one is provided?","zh":"坐汽车且有安全带时，谁应系好安全带？","options":["Only the driver","Only adults","Everyone who has a seat belt"],"answer":2,"why":"Seat belts help keep passengers safe.","whyZh":"安全带帮助保护乘客。"},"rules-12":{"id":"rules-12","topic":"rules","en":"What is a good reason for lining up?","zh":"排队有什么好处？","options":["It keeps the group orderly and fair","It makes everyone lose","It changes the weather"],"answer":0,"why":"Lines help people take turns and stay organized.","whyZh":"排队有助于维持秩序和公平。"},"rules-13":{"id":"rules-13","topic":"rules","en":"You borrowed a crayon. What should you do next?","zh":"借了同学的蜡笔，用完后应该怎么办？","options":["Keep it forever","Return it to its owner","Throw it away"],"answer":1,"why":"Returning borrowed things shows responsibility and respect.","whyZh":"归还借来的物品体现责任和尊重。"},"rules-14":{"id":"rules-14","topic":"rules","en":"Why is a playground rule “wait for your turn” helpful?","zh":"游乐场“轮流玩”的规则为什么有用？","options":["It makes the slide taller","It stops the sun","It helps prevent pushing and keeps play fair"],"answer":2,"why":"Waiting your turn improves fairness and safety.","whyZh":"排队轮流能减少推挤，也更公平。"},"rules-15":{"id":"rules-15","topic":"rules","en":"Your friend asks you to break a rule. What should you do?","zh":"朋友叫你违反规定时应该怎么办？","options":["Say no politely and choose a safe action","Break it because they asked","Hide from the teacher"],"answer":0,"why":"Good choices follow important safety rules.","whyZh":"做出好选择包括遵守安全规则。"},"rules-16":{"id":"rules-16","topic":"rules","en":"Which is an example of a law?","zh":"哪一个属于法律的例子？","options":["Wear a blue shirt to class","Follow traffic signals","Use a red pencil"],"answer":1,"why":"Traffic rules are enforced as laws in many places.","whyZh":"交通信号规则属于许多地方的交通法规。"},"community-1":{"id":"community-1","topic":"community","en":"Who helps put out fires and rescue people?","zh":"谁帮助灭火和救援？","options":["Librarian","Chef","Firefighter"],"answer":2,"why":"Firefighters help during fires and emergencies.","whyZh":"消防员负责灭火和紧急救援。"},"community-2":{"id":"community-2","topic":"community","en":"Where can you borrow books?","zh":"在哪里可以借书？","options":["Library","Fire station","Supermarket"],"answer":0,"why":"Libraries lend books to readers.","whyZh":"图书馆可以借阅图书。"},"community-3":{"id":"community-3","topic":"community","en":"Who helps sick people at a hospital?","zh":"谁在医院帮助生病的人？","options":["Builder","Doctor","Librarian"],"answer":1,"why":"Doctors care for patients.","whyZh":"医生照顾病人。"},"community-4":{"id":"community-4","topic":"community","en":"What does honesty mean?","zh":"“Honesty”是什么意思？","options":["Being the fastest","Being very quiet","Telling the truth"],"answer":2,"why":"Honesty means being truthful.","whyZh":"诚实就是讲真话。"},"community-5":{"id":"community-5","topic":"community","en":"A new student feels lonely. What is a kind choice?","zh":"新同学感到孤单，可以怎样做？","options":["Invite the student to play","Ignore the student","Laugh at the student"],"answer":0,"why":"Including people helps make a welcoming community.","whyZh":"邀请他人加入能建立友善社区。"},"community-6":{"id":"community-6","topic":"community","en":"You see litter on the playground. What can you do safely?","zh":"在操场看到垃圾，怎样安全地处理？","options":["Kick it into a pond","Use a bin if safe, or tell an adult","Leave sharp rubbish alone but never tell anyone"],"answer":1,"why":"Pick up ordinary litter only when safe; ask an adult about dangerous items.","whyZh":"安全时可把普通垃圾丢进垃圾桶；危险物品要告诉成人。"},"community-7":{"id":"community-7","topic":"community","en":"Who helps people find the right books?","zh":"谁帮助大家找到合适的书？","options":["Pilot","Dentist","Librarian"],"answer":2,"why":"Librarians help readers find and use books.","whyZh":"图书管理员帮助读者找书。"},"community-8":{"id":"community-8","topic":"community","en":"Which action makes your community better?","zh":"哪种行为能让社区变得更好？","options":["Respect shared spaces","Draw on other people’s walls","Push people in line"],"answer":0,"why":"Caring for shared places is good citizenship.","whyZh":"爱护公共空间是好公民的表现。"},"community-9":{"id":"community-9","topic":"community","en":"Where would you go to get medical care?","zh":"需要医疗护理时应该去哪里？","options":["Library","Hospital","Park"],"answer":1,"why":"Hospitals provide medical care.","whyZh":"医院提供医疗护理。"},"community-10":{"id":"community-10","topic":"community","en":"You broke a classmate’s toy by accident. What is honest?","zh":"不小心弄坏同学的玩具，怎样做才诚实？","options":["Hide it","Blame someone else","Explain what happened and say sorry"],"answer":2,"why":"Honesty and responsibility help build trust.","whyZh":"诚实和承担责任有助于建立信任。"},"community-11":{"id":"community-11","topic":"community","en":"Which person often helps protect public safety?","zh":"谁经常帮助维护公共安全？","options":["Police officer","Painter","Singer"],"answer":0,"why":"Police officers help with public safety.","whyZh":"警察帮助维护公共安全。"},"community-12":{"id":"community-12","topic":"community","en":"Why do communities need different workers?","zh":"社区为什么需要不同职业的人？","options":["They all do the same job","People have different needs and skills","Only one job matters"],"answer":1,"why":"Helpers contribute different services.","whyZh":"不同职业提供不同的服务。"},"community-13":{"id":"community-13","topic":"community","en":"Which place is for outdoor play?","zh":"哪个地方适合户外游戏？","options":["Hospital room","Busy road","Park"],"answer":2,"why":"Parks offer spaces for outdoor activities.","whyZh":"公园提供户外活动空间。"},"community-14":{"id":"community-14","topic":"community","en":"How can you show respect to a community helper?","zh":"怎样尊重社区工作者？","options":["Speak politely and say thank you","Interrupt and shout","Make fun of their job"],"answer":0,"why":"Polite words show gratitude and respect.","whyZh":"礼貌表达谢意就是尊重。"},"community-15":{"id":"community-15","topic":"community","en":"What should you do if you find something that belongs to someone else?","zh":"捡到别人的东西应该怎么办？","options":["Keep it without telling anyone","Give it to a teacher or responsible adult","Throw it away"],"answer":1,"why":"Returning lost items is honest and responsible.","whyZh":"上交拾获物品体现诚实与责任。"},"community-16":{"id":"community-16","topic":"community","en":"A community garden needs help. Which choice contributes?","zh":"社区花园需要帮忙，怎样做是在作贡献？","options":["Pull out healthy plants","Step on flowers","Help water plants with permission"],"answer":2,"why":"Helping care for shared plants benefits everyone.","whyZh":"经同意帮助浇花有益于社区。"},"digital-1":{"id":"digital-1","topic":"digital","en":"An online stranger asks for your home address. What should you do?","zh":"网上陌生人问你家地址，你应该怎么办？","options":["Tell them","Do not share it; tell an adult","Send a photo of your house"],"answer":1,"why":"A home address is private information.","whyZh":"家庭住址属于私人信息。"},"digital-2":{"id":"digital-2","topic":"digital","en":"What should you do with your password?","zh":"应该怎样保护密码？","options":["Tell everyone","Write it in a public post","Keep it private"],"answer":2,"why":"Passwords protect your accounts and information.","whyZh":"密码保护账户和信息。"},"digital-3":{"id":"digital-3","topic":"digital","en":"A strange pop-up appears on your iPad. What is a safe choice?","zh":"iPad 出现陌生弹窗，怎样做才安全？","options":["Do not tap it; ask a trusted adult","Tap every button","Send it to strangers"],"answer":0,"why":"Unexpected links or pop-ups can be unsafe.","whyZh":"陌生链接和弹窗可能不安全。"},"digital-4":{"id":"digital-4","topic":"digital","en":"Before sharing a friend’s photo online, what should you do?","zh":"网上分享朋友照片之前，应该做什么？","options":["Share it secretly","Ask permission and check with an adult","Add their address"],"answer":1,"why":"Respect other people’s privacy.","whyZh":"应该尊重他人的隐私。"},"digital-5":{"id":"digital-5","topic":"digital","en":"Which message is kind to send online?","zh":"哪句话适合友善地发给别人？","options":["You are stupid!","Nobody likes you!","Great job!"],"answer":2,"why":"Kind words make digital spaces better.","whyZh":"友善的话语让网络环境更好。"},"digital-6":{"id":"digital-6","topic":"digital","en":"You see something scary online. What should you do?","zh":"网上看到可怕的内容，应该怎么办？","options":["Stop viewing it and tell a trusted adult","Keep watching alone","Send it to every friend"],"answer":0,"why":"Trusted adults can help when online content is upsetting.","whyZh":"让可信任的成人帮助处理令人不安的内容。"},"digital-7":{"id":"digital-7","topic":"digital","en":"Which detail is private information?","zh":"哪项属于私人信息？","options":["Your favorite color","Your home address","Your favorite fruit"],"answer":1,"why":"Your address should not be shared with strangers.","whyZh":"家庭住址不应该告诉陌生人。"},"digital-8":{"id":"digital-8","topic":"digital","en":"What does it mean to be a good digital citizen?","zh":"什么是好的数字公民？","options":["Click every link","Use mean words","Be safe, kind and responsible online"],"answer":2,"why":"Digital citizenship includes safety, kindness and responsibility.","whyZh":"数字公民要安全、友善和负责任。"},"digital-9":{"id":"digital-9","topic":"digital","en":"A game asks for your parent’s credit card. What should you do?","zh":"游戏要求填写家长信用卡信息，怎么办？","options":["Ask a trusted adult; do not enter it","Type random numbers","Take a photo and send it"],"answer":0,"why":"Payment information is sensitive and needs adult supervision.","whyZh":"付款信息非常敏感，应该由成人处理。"},"digital-10":{"id":"digital-10","topic":"digital","en":"Someone online is being mean to you. What should you do?","zh":"有人在网上欺负你，应该怎么办？","options":["Share your password to stop them","Do not argue; ask a trusted adult for help","Send a mean reply"],"answer":1,"why":"An adult can help you block or report harmful messages.","whyZh":"成人可以帮助屏蔽或举报不友善的信息。"},"digital-11":{"id":"digital-11","topic":"digital","en":"Which website action is safer?","zh":"哪种上网行为更安全？","options":["Meet an online stranger alone","Download everything you see","Use websites approved by a trusted adult"],"answer":2,"why":"Adult guidance helps children choose safe sites.","whyZh":"在成人指导下访问网站更安全。"},"digital-12":{"id":"digital-12","topic":"digital","en":"What should you do before downloading an unknown app?","zh":"下载陌生应用前应该怎么做？","options":["Ask a trusted adult","Download it immediately","Share your password"],"answer":0,"why":"Adults can help check if an app is suitable and safe.","whyZh":"成人可以帮助判断应用是否合适、安全。"},"digital-13":{"id":"digital-13","topic":"digital","en":"Why should you take breaks from the iPad?","zh":"为什么使用 iPad 要适当休息？","options":["So you can forget all rules","To rest your eyes and body","So you can click more ads"],"answer":1,"why":"Healthy technology use includes breaks and balance.","whyZh":"健康使用电子设备需要休息和适度。"},"digital-14":{"id":"digital-14","topic":"digital","en":"A friend asks to use your account password. What should you do?","zh":"朋友想借用你的账户密码，该怎么办？","options":["Tell everyone in class","Write it on the wall","Keep it private and ask an adult if needed"],"answer":2,"why":"Do not share account passwords with friends.","whyZh":"不要把账户密码告诉朋友。"},"digital-15":{"id":"digital-15","topic":"digital","en":"Before posting a picture with your school badge, what should you do?","zh":"发布带有学校校徽的照片之前应该怎么做？","options":["Ask a trusted adult and consider privacy","Post your school address too","Tag unknown people"],"answer":0,"why":"Photos can reveal identifying information.","whyZh":"照片可能透露个人身份和地点信息。"},"digital-16":{"id":"digital-16","topic":"digital","en":"You are not sure if a link is safe. What is the best action?","zh":"不确定链接是否安全，最好怎么做？","options":["Tap it just once","Do not open it; ask a trusted adult","Send it to other kids"],"answer":1,"why":"When unsure, stop and ask for help.","whyZh":"不确定时先不要点击，向可信任成人求助。"}}}</script>
<script>
'use strict';
const {topics,questions}=JSON.parse(document.getElementById('review-data').textContent);
const topicById=Object.fromEntries(topics.map(x=>[x.id,x]));
const KEY='sss_adventure_grade1_v2';
const defaults=()=>({best:{},mistakes:[],attempts:[],zh:true,voice:true});
let store=defaults();
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null'); if(saved&&typeof saved==='object') store={...store,...saved,best:saved.best||{},mistakes:Array.isArray(saved.mistakes)?saved.mistakes:[],attempts:Array.isArray(saved.attempts)?saved.attempts:[]};}catch(e){}
let page='home',chosenUnit=topics[0].id,flashIndex=0,flipped=false,quiz=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=id=>questions[id];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
const idsFor=(unit,type)=>topicById[unit].qids[type];
const allIds=(type)=>topics.flatMap(t=>t.qids[type]);
const lastAttempts=id=>store.attempts.filter(a=>a.id===id);
const best=id=>store.best[id];
const pct=(a,b)=>b?Math.round(a/b*100):0;
const zhline=s=>store.zh?`<p class="qzh">${esc(s)}</p>`:'';
function speak(text){if(!store.voice)return notify('语音已关闭，可在右上角开启');if(!('speechSynthesis' in window))return notify('此浏览器不支持朗读');try{speechSynthesis.cancel();let msg=new SpeechSynthesisUtterance(text);msg.lang='en-US';msg.rate=.82;msg.pitch=1.04;speechSynthesis.speak(msg)}catch(e){notify('朗读暂不可用')}}
let toastTimeout;
function notify(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>t.classList.remove('show'),2400)}
function scrollTop(){window.scrollTo({top:0,behavior:'instant'})}
function setPage(name){if(quiz && page==='quiz')quiz=null;page=name;render();scrollTop()}
function navUpdate(){document.querySelectorAll('.nav button').forEach(btn=>{const active=page===btn.dataset.view||(page==='quiz'&&btn.dataset.view===(quiz?.mode==='practice'?'units':'exams'))||(page==='results'&&btn.dataset.view===(quiz?.mode==='practice'?'units':'exams'));btn.classList.toggle('active',active);btn.setAttribute('aria-current',active?'page':'false')});$('mistakeBadge').textContent=store.mistakes.length?`(${store.mistakes.length})`:'';$('toggleZh').textContent=store.zh?'中 EN ✓':'EN only';$('voiceButton').textContent=store.voice?'🔊 朗读':'🔇 朗读';}
function render(){navUpdate();const root=$('main');let h='';if(page==='home')h=renderHome();if(page==='units')h=renderUnits();if(page==='exams')h=renderExams();if(page==='flash')h=renderFlash();if(page==='wrongs')h=renderWrongs();if(page==='quiz')h=renderQuiz();if(page==='results')h=renderResults();root.innerHTML=h;}
function hUnit(t){const b=best('practice:'+t.id);return `<article class="unit ${t.color}"><div class="unit-top"><div class="unit-icon">${t.icon}</div><span class="unit-number">UNIT ${t.num}</span></div><h3>${esc(t.en)}</h3><div class="translation">${esc(t.zh)}</div><p class="unit-desc">${esc(t.desc)}</p><div class="unit-footer"><span class="progress-note">${b?`最好 ${b.score}/${b.total} · ${pct(b.score,b.total)}%`:'尚未练习 · 8题'}</span><button class="go" data-action="practice" data-unit="${t.id}">开始练习 →</button></div></article>`}
function renderHome(){const total=Object.keys(store.best).filter(k=>k.startsWith('practice:')).length;const exams=lastAttempts('mockA').length+lastAttempts('mockB').length;return `<section class="hero"><div><div class="eyebrow">SHSID · Grade 1 · Semester 1</div><h1>Science &<br>Social Studies<br>Midterm Quest ✨</h1><p>6 个主题 · 英文朗读 · 即时反馈 · 模拟考试。每天玩 15 分钟，把知识变成超能力！</p><button class="btn-primary" data-view="units">🚀 开始闯关</button></div><div class="hero-emoji" aria-hidden="true">🌍🔬</div></section><div class="stats"><div class="stat"><div><strong>${total}/6</strong><small>已练习单元</small></div><i>🌱</i></div><div class="stat"><div><strong>${exams}</strong><small>完成模拟考试</small></div><i>🏆</i></div><div class="stat"><div><strong>${store.mistakes.length}</strong><small>需要复习的错题</small></div><i>💡</i></div></div><div class="section-heading"><div><h2>🧩 六大知识冒险</h2><p>先复习三个 Science，再挑战三个 Social Studies。</p></div><button class="pill-btn" data-view="units">全部单元 →</button></div><div class="subject-split">🔬 Science · 科学</div><section class="unit-grid">${topics.filter(t=>t.subject==='Science').map(hUnit).join('')}</section><div class="subject-split" style="margin-top:24px">🌎 Social Studies · 社会学</div><section class="unit-grid">${topics.filter(t=>t.subject!=='Science').map(hUnit).join('')}</section><div class="section-heading"><div><h2>📝 考前模拟</h2><p>每卷 24 题，覆盖全部 6 个单元。交卷后统一评分。</p></div></div>${renderExamCards()}`}
function renderUnits(){return `<div class="subpage-head"><div><h1>🧩 单元练习</h1><p>每个单元 8 道英文题 · 回答后立即讲解 · 可以反复练习。</p></div><button class="back" data-view="home">← 首页</button></div><div class="subject-split">🔬 Science · 科学</div><section class="unit-grid">${topics.filter(t=>t.subject==='Science').map(hUnit).join('')}</section><div class="subject-split" style="margin-top:30px">🌎 Social Studies · 社会学</div><section class="unit-grid">${topics.filter(t=>t.subject!=='Science').map(hUnit).join('')}</section>`}
function renderExamCards(){return `<section class="test-grid">${['mockA','mockB'].map((id,i)=>{const b=best(id);return `<article class="test"><div><h3>Mock Test ${i?'B':'A'}</h3><p>24 Questions · 6 Topics · ${i?'Set B':'Set A'}<br>答题过程中不显示答案，交卷后查看解析。</p>${b?`<small>🏅 最高 ${b.score}/24 (${pct(b.score,24)}%)</small><br><br>`:''}<button class="btn-primary" data-action="exam" data-mode="${id}">${b?'再次挑战':'开始考试'} →</button></div><div class="letter">${i?'B':'A'}</div></article>`}).join('')}</section>`}
function renderExams(){return `<div class="subpage-head"><div><h1>📝 模拟考试</h1><p>两套不同题目，每套 24 题（Science 12 + Social Studies 12）。</p></div><button class="back" data-view="home">← 首页</button></div><div class="instruction">💡 考试模式：先完成所有题目，再按「交卷评分」。可以回到上一题修改答案；不会在作答过程中提示对错。</div>${renderExamCards()}<div class="section-heading"><div><h2>🎯 评分方式</h2><p>每题 1 分，满分 24 分。建议一次完成，再检查错题原因。</p></div></div>`}
function begin(mode,unit){const qids=mode==='practice'?[...idsFor(unit,'practice')]:allIds(mode);quiz={mode,unit:unit||null,qids,index:0,answers:{},finished:false,saved:false};page='quiz';render();scrollTop()}
function selectAnswer(idx){if(!quiz||quiz.finished)return;const id=quiz.qids[quiz.index];if(quiz.mode==='practice'&&quiz.answers[id]!==undefined)return;quiz.answers[id]=idx;render()}
function goQuestion(step){if(!quiz)return;const next=quiz.index+step;if(next<0||next>=quiz.qids.length)return;if(quiz.mode==='practice'&&step>0&&quiz.answers[quiz.qids[quiz.index]]===undefined)return;quiz.index=next;render();scrollTop()}
function renderQuiz(){if(!quiz)return '';const q=byId(quiz.qids[quiz.index]),a=quiz.answers[q.id],answered=a!==undefined,practice=quiz.mode==='practice',reveal=practice&&answered,isLast=quiz.index===quiz.qids.length-1,topic=topicById[q.topic],modeTitle=practice?topic.en:'Mock Test '+(quiz.mode==='mockA'?'A':'B'),nAnswered=Object.keys(quiz.answers).length;return `<div class="quiz-frame"><div class="subpage-head"><div><h1>${practice?topic.icon+' '+esc(topic.en):'📝 '+modeTitle}</h1><p>${practice?'Practice Mode · 答题后即时解析':'Exam Mode · 交卷前不显示答案'}</p></div><button class="back" data-action="leave">✕ 退出</button></div><div class="panel"><div class="quiz-top"><span class="tag ${practice?'':'exam'}">${practice?'🧩 单元挑战':'📝 模拟考试'} · ${topic.subject}</span><span class="step-count">${quiz.index+1} / ${quiz.qids.length}</span></div><div class="progress-track" role="progressbar" aria-valuenow="${quiz.index+1}" aria-valuemin="0" aria-valuemax="${quiz.qids.length}"><div class="progress-fill" style="width:${(quiz.index+1)/quiz.qids.length*100}%"></div></div><button class="read-btn" data-action="speakQuestion">🔊 Listen to the question · 听英文</button><h2 class="question">${esc(q.en)}</h2>${zhline(q.zh)}<div class="options">${q.options.map((o,i)=>{let cls=answered&&a===i?' selected':'';if(reveal){if(i===q.answer)cls=' correct';else if(i===a)cls=' wrong'}return `<button class="option${cls}" data-action="answer" data-answer="${i}" ${reveal?'disabled':''} aria-pressed="${answered&&a===i?'true':'false'}"><span class="choice-mark">${reveal&&i===q.answer?'✓':reveal&&i===a&&a!==q.answer?'✕':'ABC'[i]}</span><span>${esc(o)}</span></button>`}).join('')}</div>${reveal?`<div class="answer-note ${a===q.answer?'':'bad'}"><b>${a===q.answer?'🌟 Correct! 做对了！':'💪 Keep learning! 再记住这个知识点'}</b><div>${esc(q.why)}</div>${store.zh?`<small>${esc(q.whyZh)}</small>`:''}</div>`:''}<div class="quiz-bottom"><div><button class="btn-secondary" data-action="previous" ${quiz.index===0?'disabled':''}>← 上一题</button></div><div class="right">${isLast?`<button class="btn-primary" data-action="finish">${practice?'完成练习':'交卷评分'} ✓</button>`:`<button class="btn-primary" data-action="next" ${practice&&!answered?'disabled':''}>下一题 →</button>`}</div></div><div class="quiz-info">${practice?'练习模式答题后不可修改；完成后可重新练习。':`已作答 ${nAnswered}/${quiz.qids.length} 题 · 可以点击「上一题」检查或修改。`}</div></div></div>`}
function finish(){if(!quiz)return;const n=Object.keys(quiz.answers).length,tot=quiz.qids.length;if(n<tot&&!window.confirm(`还有 ${tot-n} 道题未作答。现在交卷吗？\n未作答题将按错误计算。`))return;quiz.finished=true;const score=quiz.qids.filter(id=>quiz.answers[id]===byId(id).answer).length;quiz.score=score;const key=quiz.mode==='practice'?'practice:'+quiz.unit:quiz.mode;store.attempts.push({id:key,date:new Date().toISOString(),score,total:tot});store.attempts=store.attempts.slice(-80);if(!store.best[key]||score>store.best[key].score)store.best[key]={score,total:tot};const errs=quiz.qids.filter(id=>quiz.answers[id]!==byId(id).answer);store.mistakes=[...new Set([...store.mistakes,...errs])];save();page='results';render();scrollTop()}
function renderResults(){if(!quiz)return '';const score=quiz.score,tot=quiz.qids.length,pc=pct(score,tot);const text=pc===100?'Perfect! 你是知识小达人！':pc>=80?'Great job! 表现很棒！':pc>=60?'Good effort! 继续加油！':'Keep going! 再复习会更好！';const subjects=['Science','Social Studies'];return `<div class="quiz-frame"><div class="subpage-head"><div><h1>🏆 挑战完成</h1><p>${quiz.mode==='practice'?esc(topicById[quiz.unit].en):'Mock Test '+(quiz.mode==='mockA'?'A':'B')} · 成绩与解析</p></div><button class="back" data-view="home">← 首页</button></div><div class="panel"><div class="result-hero"><div class="result-symbol">${pc===100?'🏆':pc>=75?'🎉':'🌈'}</div><div class="score">${score}<span style="font-size:27px;color:#8c9eaf;letter-spacing:0"> / ${tot}</span></div><h2>${text}</h2><p>正确率 ${pc}% · 错 ${tot-score} 题。下面可以逐题看正确答案和原因。</p><div class="result-actions"><button class="btn-primary" data-action="retake">🔄 再挑战一次</button><button class="btn-secondary" data-view="wrongs">💡 打开错题本</button></div></div>${quiz.mode!=='practice'?`<div class="breakdown">${subjects.map(s=>{const qs=quiz.qids.filter(id=>topicById[byId(id).topic].subject===s),ok=qs.filter(id=>quiz.answers[id]===byId(id).answer).length;return `<div class="break-box"><b>${s==='Science'?'🔬':'🌎'} ${s}</b><span>${ok}/${qs.length}</span></div>`}).join('')}</div>`:''}<h3 class="result-heading">🔍 逐题讲解</h3><div class="review-list">${quiz.qids.map((id,i)=>{const q=byId(id),a=quiz.answers[id],correct=a===q.answer;return `<article class="review-item ${correct?'right':'wrong'}"><h3>${correct?'✅':'❌'} ${i+1}. ${esc(q.en)}</h3>${store.zh?`<p>${esc(q.zh)}</p>`:''}${!correct?`<p>你的答案：${a===undefined?'未作答':esc(q.options[a])}</p>`:''}<div class="correct-answer">正确答案：${esc(q.options[q.answer])}</div><p>${esc(q.why)}</p>${store.zh?`<p>${esc(q.whyZh)}</p>`:''}</article>`}).join('')}</div><div class="result-actions" style="margin-top:24px"><button class="btn-secondary" data-view="home">回到首页</button><button class="btn-primary" data-action="retake">重新开始 →</button></div></div></div>`}
function renderFlash(){const t=topicById[chosenUnit];flashIndex=Math.min(flashIndex,t.vocab.length-1);const [en,zh,example]=t.vocab[flashIndex];return `<div class="subpage-head"><div><h1>🗂️ 英文单词卡</h1><p>点击卡片翻面看中文解释和英文例句，亦可听朗读。</p></div><button class="back" data-view="home">← 首页</button></div><div class="chips">${topics.map(t=>`<button class="chip ${chosenUnit===t.id?'selected':''}" data-action="chooseUnit" data-unit="${t.id}">${t.icon} ${esc(t.en)}</button>`).join('')}</div><button class="flash-card" data-action="flip" aria-label="点击翻转词卡"><span class="flash-small">WORD ${flashIndex+1} OF ${t.vocab.length}</span><h2>${esc(en)}</h2>${flipped?`<div class="flash-zh">${esc(zh)}</div><div class="flash-example">“${esc(example)}”</div>`:`<div class="flash-hidden">❔ 点击卡片看解释</div>`}<div class="tap">${flipped?'👆 点击再次隐藏答案':'👆 TAP TO REVEAL'}</div></button><div class="flash-controls"><button class="btn-secondary" data-action="flashPrev" ${flashIndex===0?'disabled':''}>← 上一个</button><span class="flash-counter">${flashIndex+1} / ${t.vocab.length}</span><button class="btn-flat" data-action="speakWord">🔊 朗读</button><button class="btn-primary" data-action="flashNext" ${flashIndex===t.vocab.length-1?'disabled':''}>下一个 →</button></div>`}
function renderWrongs(){const ids=store.mistakes.filter(id=>byId(id));return `<div class="subpage-head"><div><h1>💡 我的错题本</h1><p>这里记录过去做错的题。理解后点「已掌握」即可从错题本移除。</p></div><button class="back" data-view="home">← 首页</button></div>${ids.length?`<div class="instruction">📌 共有 ${ids.length} 道待复习题。每题都有正确答案与中英文解释；做错不怕，学会才重要。</div>${ids.map((id,i)=>{const q=byId(id),t=topicById[q.topic];return `<div class="wrong-card"><div><small>${t.icon} ${esc(t.en)} · 第 ${i+1} 题</small><h3>${esc(q.en)}</h3>${store.zh?`<small>${esc(q.zh)}</small>`:''}<p>✓ ${esc(q.options[q.answer])} — ${esc(q.why)}</p>${store.zh?`<small>${esc(q.whyZh)}</small>`:''}</div><button class="pill-btn" style="flex-shrink:0" data-action="master" data-id="${id}">✓ 已掌握</button></div>`}).join('')}<div class="two-actions"><button class="btn-secondary" data-action="clearWrongs">清空错题本</button><button class="btn-primary" data-view="units">回到单元练习 →</button></div>`:`<div class="panel empty"><div class="emoji">🎈</div><h2>现在没有待复习错题！</h2><p>先做一些单元练习或模拟考试，错题会自动出现在这里。</p><button class="btn-primary" data-view="units">开始答题 →</button></div>`}`}
// Event delegation avoids re-attaching listeners after each screen change.
document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-view]');if(!el)return;if(el.dataset.view){setPage(el.dataset.view);return}const action=el.dataset.action;switch(action){case'practice':begin('practice',el.dataset.unit);break;case'exam':begin(el.dataset.mode);break;case'answer':selectAnswer(+el.dataset.answer);break;case'next':goQuestion(1);break;case'previous':goQuestion(-1);break;case'finish':finish();break;case'leave':if(window.confirm('退出当前练习？未交卷的答案不会保存。')){quiz=null;setPage('home')}break;case'retake':{const mode=quiz.mode,unit=quiz.unit;begin(mode,unit);break}case'speakQuestion':{const q=byId(quiz.qids[quiz.index]);speak(q.en+' ... '+q.options.map((x,i)=>'Option '+String.fromCharCode(65+i)+': '+x).join('. '));break}case'chooseUnit':chosenUnit=el.dataset.unit;flashIndex=0;flipped=false;render();break;case'flip':flipped=!flipped;render();break;case'flashPrev':flashIndex=Math.max(0,flashIndex-1);flipped=false;render();break;case'flashNext':flashIndex=Math.min(topicById[chosenUnit].vocab.length-1,flashIndex+1);flipped=false;render();break;case'speakWord':speak(topicById[chosenUnit].vocab[flashIndex][0]+'. '+topicById[chosenUnit].vocab[flashIndex][2]);break;case'master':store.mistakes=store.mistakes.filter(x=>x!==el.dataset.id);save();render();notify('已从错题本移除！');break;case'clearWrongs':if(confirm('确定清空全部错题吗？')){store.mistakes=[];save();render()}break;}});
$('logo').addEventListener('click',()=>setPage('home'));
$('toggleZh').addEventListener('click',()=>{store.zh=!store.zh;save();render();notify(store.zh?'已开启中文辅助':'已隐藏中文，英文挑战开始！')});
$('voiceButton').addEventListener('click',()=>{store.voice=!store.voice;save();navUpdate();notify(store.voice?'已开启英文朗读':'已关闭英文朗读')});
document.addEventListener('keydown',e=>{if(page!=='quiz'||!quiz||e.ctrlKey||e.altKey||e.metaKey)return;if(['1','2','3'].includes(e.key))selectAnswer(Number(e.key)-1);else if(e.key==='ArrowRight'){if(e.target.tagName!=='BUTTON')goQuestion(1)}else if(e.key==='ArrowLeft'){if(e.target.tagName!=='BUTTON')goQuestion(-1)}});
render();
</script>
</body>
</html>
