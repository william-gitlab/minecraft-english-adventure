<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b1f37"><title>SEAMO Pre-A | iPad 互动模拟考试</title>
<style>
:root{--navy:#10253f;--deep:#071e34;--blue:#286cdd;--sky:#edf4ff;--ink:#17243a;--muted:#65738a;--line:#dfe7f2;--green:#168568;--bg:#f3f6fc;--card:#fff;--red:#b33248}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}button{font-family:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #73afff;outline-offset:2px}.shell{max-width:880px;margin:0 auto;padding:20px 18px 44px}.brand{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.logo{font-weight:950;font-size:19px;letter-spacing:.4px;color:var(--navy)}.micro{color:var(--muted);font-size:13px}.hero{background:linear-gradient(135deg,#102943 0%,#1e54a4 100%);color:white;border-radius:24px;padding:28px 26px;margin-bottom:19px;box-shadow:0 8px 24px #15315415}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-weight:850;font-size:12px;opacity:.76}.hero h1{font-size:clamp(25px,5vw,36px);margin:10px 0 12px;line-height:1.28}.hero p{margin:0;color:#dceafe;line-height:1.7}.pill-row{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.pill{font-size:13px;background:#ffffff20;border:1px solid #ffffff3b;padding:7px 11px;border-radius:30px}.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:15px;box-shadow:0 3px 9px #24354f07}.panel h2{font-size:22px;margin:4px 0 11px}.panel p{line-height:1.7;color:var(--muted);margin:7px 0}.card-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.paper-card{padding:22px;background:#fff;border-radius:22px;border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}.paper-tag{font-size:12px;color:var(--blue);font-weight:850;letter-spacing:1.1px}.paper-card h2{margin:0;font-size:25px}.paper-card p{color:var(--muted);line-height:1.6;margin:0;flex:1}.btn{border:0;border-radius:13px;padding:13px 18px;font-weight:800;font-size:16px;line-height:1.35;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}.btn-primary{background:#2264db;color:white}.btn-primary:hover{background:#1653bb}.btn-secondary{background:var(--sky);color:var(--blue)}.btn-outline{background:white;color:var(--navy);border:1px solid #cddbee}.btn-danger{background:#fff1f3;color:#9f2343;border:1px solid #f8ccd5}.btn:disabled{opacity:.36;cursor:default}.wide{width:100%}.tiny{font-size:13px}.notice{font-size:13px;line-height:1.7;color:#69758b;margin:15px 5px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.timer{font-weight:900;color:#102846;background:#fff;border:1px solid var(--line);border-radius:100px;padding:10px 15px;min-width:111px;text-align:center;font-variant-numeric:tabular-nums}.timer.urgent{color:var(--red);background:#fff2f4}.progress{height:9px;background:#e5edf8;border-radius:12px;overflow:hidden;margin:14px 0}.progress>div{height:100%;background:#3e7be1;border-radius:12px;transition:width .2s}.stepbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.stepbar .question-num{font-weight:900;font-size:17px}.point-badge{background:#eaf3ff;color:#2655a8;padding:7px 11px;border-radius:30px;font-weight:750;font-size:13px}.question-panel{padding:26px;margin-top:10px}.q-en{font-size:clamp(21px,4vw,27px);font-weight:800;line-height:1.5;letter-spacing:-.2px;color:#162c4c;margin:12px 0}.q-zh{font-size:clamp(15px,2.9vw,18px);line-height:1.7;color:#52627b;margin:8px 0 18px}.audio-row{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0 6px}.audio-row .btn{font-size:15px}.viz{background:linear-gradient(180deg,#f8fbff,#eef4fc);border:1px solid #d9e5f6;border-radius:18px;min-height:98px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;padding:20px;gap:12px;margin:20px 0}.visual-emoji{font-size:43px;line-height:1.35}.visual-text{font-size:clamp(25px,6vw,41px);font-weight:900;letter-spacing:2px;color:#1b3a64;text-align:center}.visual-small{font-size:clamp(20px,5vw,32px);letter-spacing:2px}.visual-caption{width:100%;font-size:13px;text-align:center;color:#6e7e97;letter-spacing:0}.choices{display:flex;flex-direction:column;gap:11px;margin-top:16px}.choice{width:100%;background:#fff;border:2px solid #dfe6f1;min-height:72px;border-radius:15px;padding:14px 16px;display:flex;align-items:center;gap:16px;text-align:left;color:#192941}.choice .circle{flex:0 0 38px;width:38px;height:38px;border-radius:50%;background:#eff3f9;color:#526884;display:grid;place-items:center;font-size:16px;font-weight:850}.choice .choice-text{display:flex;flex-direction:column;gap:5px;font-size:19px;font-weight:800}.choice .choice-zh{font-size:14px;font-weight:500;color:#68768b}.choice.selected{background:#ebf3ff;border-color:#2c6ce0}.choice.selected .circle{background:#286bdf;color:white}.choice.selected .choice-zh{color:#415c8c}.controls{display:flex;gap:9px;align-items:center;justify-content:space-between;margin:20px 0}.controls button{flex:1}.dots{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:5px;margin:8px 0 0}.dot{aspect-ratio:1;background:#e8edf6;border:1px solid #cbd6e6;border-radius:8px;color:#5c718e;font-size:12px;font-weight:800;padding:0}.dot.answered{background:#b6d2ff;border-color:#8ab9ff;color:#173d80}.dot.current{outline:3px solid #286cdf;outline-offset:1px}.submit-area{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 0 0}.score{font-weight:950;font-size:clamp(36px,9vw,58px);line-height:1;color:#1d5dc6;margin:9px 0}.answer-review{border-top:1px solid var(--line);padding:15px 0}.answer-review:first-child{border-top:0}.answer-review .review-title{font-size:16px;font-weight:850;line-height:1.5}.answer-review p{font-size:14px;line-height:1.65;margin:7px 0;color:#56657d}.correct{color:var(--green)}.incorrect{color:var(--red)}.review-meta{font-size:13px;font-weight:850}.small-print{font-size:13px;line-height:1.65;color:var(--muted)}.clock{width:124px;height:124px}.row-shapes{font-size:38px;letter-spacing:5px}.square-grid{display:grid;grid-template-columns:repeat(2,53px);grid-template-rows:repeat(2,53px);border:3px solid #173e76}.square-grid>div{border:1.5px solid #173e76}.route-board{display:grid;grid-template-columns:repeat(3,49px);grid-template-rows:repeat(3,49px);position:relative}.route-board>div{border:1px solid #8faac8;background:#f9fbff;display:flex;align-items:center;justify-content:center;color:#153c75;font-size:18px;font-weight:900}.matchrow{display:flex;justify-content:center}.matchrow>div{height:48px;width:48px;border:4px solid #af7135;border-right:0}.matchrow>div:last-child{border-right:4px solid #af7135}.ribbon{height:11px;border-radius:8px;background:linear-gradient(90deg,#4b8cdf,#b2cfff);margin:8px 0}.ribbon-wrap{min-width:175px}.ribbon-item{display:flex;gap:12px;align-items:center;color:#63738b;font-size:13px}.boxmath{display:flex;gap:8px;align-items:center;font-size:28px;font-weight:850}.mathbox{min-width:50px;padding:8px;text-align:center;background:#fff;border:2px solid #afc4e6;border-radius:9px}.mathbox.blank{background:#fff5de}.pyramid{display:flex;flex-direction:column;gap:4px}.pyrrow{display:flex;justify-content:center;gap:4px}.pyrrow>div{width:55px;height:44px;display:grid;place-items:center;background:white;border:2px solid #a6bfdf;border-radius:8px;font-weight:900;font-size:21px}.pyrrow>.blank{background:#fff0c9;border-color:#e9ba56}.emoji-tray{display:flex;align-items:center;gap:11px;flex-wrap:wrap;justify-content:center;font-size:31px}.separate{font-size:22px;color:#59718c}.status{font-size:13px;color:var(--muted);padding:0 0 5px;min-height:22px}.danger-text{color:var(--red)!important}@media(max-width:580px){.shell{padding:14px 12px 35px}.hero{padding:22px 19px}.panel,.paper-card{padding:17px}.card-row{grid-template-columns:1fr}.question-panel{padding:19px 16px}.choice{min-height:67px}.controls{flex-wrap:wrap}.controls .btn{padding:12px}.dots{gap:3px}.dot{border-radius:5px;font-size:10px}.brand .micro{font-size:11px}}
</style></head><body>
<main class="shell" id="app" aria-live="polite"></main>
<script>
'use strict';
const PAPERS=[[{"en":"Look at the clock. What time is it?","zh":"看一看时钟。现在几点钟？","options":[{"en":"3 o’clock","zh":"3点"},{"en":"6 o’clock","zh":"6点"},{"en":"9 o’clock","zh":"9点"}],"key":0,"whyEN":"The short hand points to 3. The long hand points to 12, so it is 3 o’clock.","whyZH":"短针指向3，长针指向12，所以是3点。","visual":"clock3","say":"The short hand points to 3 and the long hand points to 12. What time is it?","topic":"Time"},{"en":"Look at the pattern. What comes next?","zh":"观察图形规律。下一个是什么？","options":[{"en":"Circle","zh":"圆形"},{"en":"Triangle","zh":"三角形"},{"en":"Square","zh":"正方形"}],"key":1,"whyEN":"The pattern repeats circle, triangle. The next shape is a triangle.","whyZH":"图形按“圆形、三角形”重复，所以下一个是三角形。","visual":"shapesA","say":"Look at the pattern: circle, triangle, circle, triangle, circle. What shape comes next?","topic":"Patterns"},{"en":"A pizza has 8 equal slices. 3 slices are eaten. How many slices are left?","zh":"一个披萨被平均分成8块，吃掉了3块，还剩几块？","options":[{"en":"4","zh":"4块"},{"en":"6","zh":"6块"},{"en":"5","zh":"5块"}],"key":2,"whyEN":"8 minus 3 equals 5.","whyZH":"8－3＝5。","visual":"pizza","say":"A pizza has eight equal slices. Three slices are eaten. How many slices are left?","topic":"Word problems"},{"en":"Three ribbons are 5 cm, 8 cm and 6 cm long. How long is the longest ribbon?","zh":"三条丝带分别长5、8和6厘米。最长的一条有多长？","options":[{"en":"8 cm","zh":"8厘米"},{"en":"6 cm","zh":"6厘米"},{"en":"5 cm","zh":"5厘米"}],"key":0,"whyEN":"8 is greater than 5 and 6.","whyZH":"8比5和6都大。","visual":"ribbons","say":"Three ribbons are five centimetres, eight centimetres and six centimetres long. How long is the longest ribbon?","topic":"Measurement"},{"en":"Find the missing number: 4, 7, 10, 13, __.","zh":"找出缺少的数字：4、7、10、13、__。","options":[{"en":"15","zh":"15"},{"en":"17","zh":"17"},{"en":"16","zh":"16"}],"key":2,"whyEN":"Add 3 each time. 13 + 3 = 16.","whyZH":"每次加3，13＋3＝16。","visual":"sequenceA","say":"Find the missing number: 4, 7, 10, 13, __.","topic":"Patterns"},{"en":"Cat, dog, bird, cat, dog, bird ... What is the 11th animal?","zh":"猫、狗、鸟、猫、狗、鸟……第11只是哪种动物？","options":[{"en":"Cat","zh":"猫"},{"en":"Dog","zh":"狗"},{"en":"Bird","zh":"鸟"}],"key":1,"whyEN":"Every group has 3 animals. The 9th is bird, the 10th is cat, and the 11th is dog.","whyZH":"每3只为一组。第9只是鸟，第10只是猫，第11只是狗。","visual":"animals","say":"Cat, dog, bird, cat, dog, bird, and so on. What is the eleventh animal?","topic":"Patterns"},{"en":"Each row adds up to 10. What number is missing?","zh":"每一行的两个数相加都等于10。问号代表几？","options":[{"en":"7","zh":"7"},{"en":"6","zh":"6"},{"en":"8","zh":"8"}],"key":0,"whyEN":"3 + 7 = 10.","whyZH":"3＋7＝10。","visual":"sum10","say":"Each row adds up to ten. The first row is four plus six. The second row is three plus question mark. What number is missing?","topic":"Number sense"},{"en":"Two apples balance six oranges. How many oranges balance one apple?","zh":"2个苹果与6个橙子一样重。1个苹果相当于几个橙子？","options":[{"en":"2","zh":"2个"},{"en":"4","zh":"4个"},{"en":"3","zh":"3个"}],"key":2,"whyEN":"Half of 2 apples is 1 apple; half of 6 oranges is 3 oranges.","whyZH":"两边同时减半：1个苹果相当于3个橙子。","visual":"balanceA","say":"Two apples have the same weight as six oranges. How many oranges have the same weight as one apple?","topic":"Logic"},{"en":"Which shape has exactly 3 straight sides?","zh":"哪一个图形恰好有3条直边？","options":[{"en":"Square","zh":"正方形"},{"en":"Triangle","zh":"三角形"},{"en":"Rectangle","zh":"长方形"}],"key":1,"whyEN":"A triangle has 3 straight sides. The other shapes have 4.","whyZH":"三角形有3条直边，其他两个都有4条。","visual":"shapesB","say":"Which shape has exactly three straight sides?","topic":"Geometry"},{"en":"Today is Monday. What day will it be 3 days later?","zh":"今天是星期一。3天后是星期几？","options":[{"en":"Wednesday","zh":"星期三"},{"en":"Friday","zh":"星期五"},{"en":"Thursday","zh":"星期四"}],"key":2,"whyEN":"Tuesday is one day later, Wednesday two, and Thursday three.","whyZH":"往后数：星期二、星期三、星期四。","visual":"days","say":"Today is Monday. What day will it be three days later?","topic":"Time"},{"en":"Three children collect 4 shells each. Then 2 shells are lost. How many shells remain?","zh":"3个小朋友每人捡到4个贝壳，后来丢了2个。还剩几个贝壳？","options":[{"en":"8","zh":"8个"},{"en":"10","zh":"10个"},{"en":"12","zh":"12个"}],"key":1,"whyEN":"3 × 4 = 12 shells. Then 12 − 2 = 10.","whyZH":"先算3×4＝12，再算12－2＝10。","visual":"shells","say":"Three children collect four shells each. Then two shells are lost. How many shells remain?","topic":"Word problems"},{"en":"A frog starts at step 0. One hop moves it forward 2 steps. The next hop moves it backward 1 step. It repeats. How many hops does it need to reach step 5 for the first time?","zh":"青蛙从第0格开始。第一跳前进2格，下一跳后退1格，不断重复。第一次到达第5格一共跳了几次？","options":[{"en":"7 hops","zh":"7次"},{"en":"6 hops","zh":"6次"},{"en":"5 hops","zh":"5次"}],"key":0,"whyEN":"The landing steps are 2, 1, 3, 2, 4, 3, 5. It arrives on hop 7.","whyZH":"每次落点：2、1、3、2、4、3、5，所以第7跳到达。","visual":"steps","say":"A frog starts at step zero. It hops forward two steps, then backward one step, repeating this pattern. How many hops does it need to reach step five for the first time?","topic":"Logic"},{"en":"One square needs 4 matchsticks. Two squares side by side need 7. How many matchsticks are needed for 5 squares in one straight row?","zh":"拼1个正方形需要4根火柴；并排拼2个正方形需要7根。并排拼5个正方形需要几根？","options":[{"en":"13","zh":"13根"},{"en":"15","zh":"15根"},{"en":"16","zh":"16根"}],"key":2,"whyEN":"The first square needs 4 matchsticks and each new square shares one side, so adds 3. 4 + 4 × 3 = 16.","whyZH":"第1个用4根，之后每个共用一条边，只增加3根。4＋4×3＝16。","visual":"matchesA","say":"One square needs four matchsticks. Two squares side by side need seven. How many matchsticks are needed for five squares in one straight row?","topic":"Patterns"},{"en":"Amy has twice as many stickers as Ben. Together they have 12 stickers. How many does Amy have?","zh":"艾米的贴纸是本的2倍，两人一共有12张。艾米有几张？","options":[{"en":"4","zh":"4张"},{"en":"8","zh":"8张"},{"en":"6","zh":"6张"}],"key":1,"whyEN":"Split 12 into 3 equal parts: Ben has 4, Amy has 8.","whyZH":"两个人的份数是1份和2份，共3份。12÷3＝4；艾米有8张。","visual":"stickers","say":"Amy has twice as many stickers as Ben. Together they have twelve stickers. How many does Amy have?","topic":"Logic"},{"en":"Count all squares, both small and large, in the picture. How many squares are there?","zh":"数一数图中所有大小的正方形，一共有多少个？","options":[{"en":"5","zh":"5个"},{"en":"4","zh":"4个"},{"en":"6","zh":"6个"}],"key":0,"whyEN":"There are 4 small squares and 1 big square. Total = 5.","whyZH":"有4个小正方形，加上1个大正方形，共5个。","visual":"grid2","say":"The picture is one big square divided into four equal small squares, two rows and two columns. Count all squares, both small and large. How many squares are there?","topic":"Geometry"}],[{"en":"Look at the clock. What time is shown?","zh":"看一看时钟。现在几点钟？","options":[{"en":"10 o’clock","zh":"10点"},{"en":"11 o’clock","zh":"11点"},{"en":"12 o’clock","zh":"12点"}],"key":1,"whyEN":"The short hand points to 11 and the long hand to 12, so it is 11 o’clock.","whyZH":"短针指向11，长针指向12，是11点。","visual":"clock11","say":"The short hand points to eleven and the long hand points to twelve. What time is shown?","topic":"Time"},{"en":"Find the missing number: 2, 4, 8, 10, 14, __.","zh":"找出缺少的数字：2、4、8、10、14、__。","options":[{"en":"16","zh":"16"},{"en":"17","zh":"17"},{"en":"18","zh":"18"}],"key":0,"whyEN":"The pattern adds 2, then 4, then 2, then 4. Next add 2 to get 16.","whyZH":"规律是依次加2、加4。14＋2＝16。","visual":"sequenceB","say":"Find the missing number: 2, 4, 8, 10, 14, __.","topic":"Patterns"},{"en":"There are 2 triangles and 1 square. How many corners are there altogether?","zh":"有2个三角形和1个正方形，一共有多少个角？","options":[{"en":"9","zh":"9个"},{"en":"11","zh":"11个"},{"en":"10","zh":"10个"}],"key":2,"whyEN":"Each triangle has 3 corners and a square has 4: 3 + 3 + 4 = 10.","whyZH":"每个三角形有3个角，正方形有4个角，所以3＋3＋4＝10。","visual":"corners","say":"There are two triangles and one square. How many corners are there altogether?","topic":"Geometry"},{"en":"Fourteen sweets are shared equally between 2 children. How many does each child get?","zh":"14颗糖果平均分给2个小朋友，每人得到几颗？","options":[{"en":"6","zh":"6颗"},{"en":"7","zh":"7颗"},{"en":"8","zh":"8颗"}],"key":1,"whyEN":"14 divided by 2 equals 7.","whyZH":"14÷2＝7。","visual":"sweets","say":"Fourteen sweets are shared equally between two children. How many does each child get?","topic":"Word problems"},{"en":"What comes next in this pattern?","zh":"这个规律中，下一个是什么？","options":[{"en":"Bird","zh":"鸟"},{"en":"Fish","zh":"鱼"},{"en":"Cat","zh":"猫"}],"key":0,"whyEN":"Fish and bird repeat. After a fish comes a bird.","whyZH":"鱼和鸟交替出现，鱼后面是鸟。","visual":"animalsB","say":"The pattern is fish, bird, fish, bird, fish. What comes next?","topic":"Patterns"},{"en":"Today is Wednesday. What day was it 2 days ago?","zh":"今天是星期三。两天前是星期几？","options":[{"en":"Sunday","zh":"星期日"},{"en":"Tuesday","zh":"星期二"},{"en":"Monday","zh":"星期一"}],"key":2,"whyEN":"One day before Wednesday is Tuesday. Two days before is Monday.","whyZH":"从星期三往前数两天：星期二、星期一。","visual":"daysB","say":"Today is Wednesday. What day was it two days ago?","topic":"Time"},{"en":"Five dots are in one straight row. How many gaps are between neighbouring dots?","zh":"5个点排成一条直线。相邻两个点之间一共有几个间隔？","options":[{"en":"5","zh":"5个"},{"en":"4","zh":"4个"},{"en":"6","zh":"6个"}],"key":1,"whyEN":"There is one fewer gap than dots: 5 − 1 = 4.","whyZH":"5个点之间只有4个间隔。","visual":"dots","say":"Five dots are in one straight row. How many gaps are between neighbouring dots?","topic":"Number sense"},{"en":"The numbers on each side of a box add up to 9. What number belongs in the empty box?","zh":"方框左右两边的数字相加等于9。空格里应该填几？","options":[{"en":"5","zh":"5"},{"en":"4","zh":"4"},{"en":"6","zh":"6"}],"key":0,"whyEN":"4 + 5 = 9.","whyZH":"4＋5＝9。","visual":"sum9","say":"Four plus the missing number is nine. What number belongs in the empty box?","topic":"Number sense"},{"en":"One teddy bear balances 2 ducks. One duck balances 3 apples. How many apples balance one teddy bear?","zh":"1只玩具熊和2只鸭子一样重；1只鸭子和3个苹果一样重。1只玩具熊相当于几个苹果？","options":[{"en":"5","zh":"5个"},{"en":"9","zh":"9个"},{"en":"6","zh":"6个"}],"key":2,"whyEN":"A teddy bear equals 2 ducks, and each duck equals 3 apples. So 2 × 3 = 6 apples.","whyZH":"玩具熊＝2只鸭子＝2×3＝6个苹果。","visual":"balanceB","say":"One teddy bear balances two ducks. One duck balances three apples. How many apples balance one teddy bear?","topic":"Logic"},{"en":"Which shape is the only one with 5 straight sides?","zh":"下面哪一个图形有5条直边？","options":[{"en":"Square","zh":"正方形"},{"en":"Pentagon","zh":"五边形"},{"en":"Triangle","zh":"三角形"}],"key":1,"whyEN":"A pentagon has 5 straight sides.","whyZH":"五边形有5条直边。","visual":"pentagon","say":"Which shape is the only one with five straight sides?","topic":"Geometry"},{"en":"Use the digits 1, 2 and 3 to make two-digit numbers. You cannot repeat a digit. How many different numbers can you make?","zh":"用数字1、2、3组成两位数，数字不能重复。一共可以组成多少个不同的两位数？","options":[{"en":"3","zh":"3个"},{"en":"9","zh":"9个"},{"en":"6","zh":"6个"}],"key":2,"whyEN":"The numbers are 12, 13, 21, 23, 31 and 32. There are 6.","whyZH":"可以组成12、13、21、23、31、32，共6个。","visual":"digits","say":"Use the digits one, two, and three to make two-digit numbers. You cannot repeat a digit. How many different numbers can you make?","topic":"Logic"},{"en":"One square needs 4 matchsticks. Every extra square in the same row shares one side. How many matchsticks make 4 squares in a row?","zh":"用火柴拼成一排正方形。第1个需要4根，每增加1个可以共用一条边。拼4个共需几根？","options":[{"en":"13","zh":"13根"},{"en":"12","zh":"12根"},{"en":"16","zh":"16根"}],"key":0,"whyEN":"4 + 3 + 3 + 3 = 13 matchsticks.","whyZH":"第一个4根，之后每个增加3根：4＋3＋3＋3＝13。","visual":"matchesB","say":"One square needs four matchsticks. Every extra square in the same row shares one side. How many matchsticks make four squares in a row?","topic":"Patterns"},{"en":"Lily is 3rd from the front in a line of 8 children. What position is she from the back?","zh":"8个小朋友排队，莉莉从前面数排第3。从后面数她排第几？","options":[{"en":"5th","zh":"第5"},{"en":"6th","zh":"第6"},{"en":"7th","zh":"第7"}],"key":1,"whyEN":"8 − 3 + 1 = 6, so Lily is 6th from the back.","whyZH":"8－3＋1＝6，所以莉莉从后面数排第6。","visual":"queue","say":"Lily is third from the front in a line of eight children. What position is she from the back?","topic":"Logic"},{"en":"In the number pyramid, each box is the sum of the two boxes below it. What number is at the top?","zh":"数字金字塔中，上面的方框等于下面相邻两个方框数字之和。最上面是几？","options":[{"en":"11","zh":"11"},{"en":"13","zh":"13"},{"en":"12","zh":"12"}],"key":2,"whyEN":"2 + 3 = 5; 3 + 4 = 7; 5 + 7 = 12.","whyZH":"2＋3＝5，3＋4＝7，5＋7＝12。","visual":"pyramid","say":"In the number pyramid, each box is the sum of the two boxes below it. The bottom row is two, three and four. What number is at the top?","topic":"Number sense"},{"en":"A robot starts at the bottom-left corner of the grid. It must move exactly 2 steps right and 2 steps up to reach the top-right corner. How many different shortest routes can it take?","zh":"机器人从方格左下角出发，必须恰好向右走2步、向上走2步，到达右上角。一共有多少条不同的最短路线？","options":[{"en":"6","zh":"6条"},{"en":"4","zh":"4条"},{"en":"8","zh":"8条"}],"key":0,"whyEN":"The 6 orders are RRUU, RURU, RUUR, URRU, URUR and UURR.","whyZH":"共有6种排列：右右上上、右上右上、右上上右、上右右上、上右上右、上上右右。","visual":"route","say":"A robot starts at the bottom-left corner of the grid. It must move exactly two steps right and two steps up to reach the top-right corner. How many different shortest routes can it take?","topic":"Logic"}]];
let exam=null,tickHandle=null;
const app=document.getElementById('app');
const escapeHTML=(s)=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function stopSpeech(){try{window.speechSynthesis?.cancel()}catch(e){}}
function btn(label,cls,action,extra=''){return `<button type="button" class="btn ${cls}" data-action="${action}" ${extra}>${label}</button>`}
function safePersist(){try{if(exam)localStorage.setItem('seamo-prea-exam-v2',JSON.stringify(exam));else localStorage.removeItem('seamo-prea-exam-v2')}catch(e){}}
function showHome(){stopSpeech();clearInterval(tickHandle);tickHandle=null;exam=null;safePersist();app.innerHTML=`<div class="brand"><div class="logo">◈ SEAMO <span style="color:#4384e1">PRE‑A</span></div><div class="micro">iPad 互动练习 · 2026</div></div><header class="hero"><div class="eyebrow">Grade 1 / 小学一年级</div><h1>SEAMO Pre-A<br>互动模拟考试</h1><p>英文完整读题 · 简体中文对照 · 40分钟倒计时 · 交卷后查看答案与讲解</p><div class="pill-row"><span class="pill">⏱ 40 分钟／份</span><span class="pill">📝 15 题选择题</span><span class="pill">⭐ 50 分</span></div></header><div class="card-row"><section class="paper-card"><div class="paper-tag">MOCK EXAM 01</div><h2>模拟卷 A</h2><p>图形规律、数字顺序、钟表、平衡问题与简单应用题。</p>${btn('开始模拟卷 A →','btn-primary wide','start0')}</section><section class="paper-card"><div class="paper-tag">MOCK EXAM 02</div><h2>模拟卷 B</h2><p>进阶逻辑、火柴正方形、位置排序、数字金字塔和路线问题。</p>${btn('开始模拟卷 B →','btn-primary wide','start1')}</section></div><section class="panel" style="margin-top:17px"><h2>给小朋友的说明</h2><p>1. 点「开始」，计时器立即开始。每一题都可以点「🔊 朗读完整英文题目」。</p><p>2. 看英文题目；不认识的字可以参考下面的简体中文。选择 A、B 或 C。</p><p>3. 题目可以前后切换，交卷之后才会显示答案。计时结束会自动交卷。</p></section><div class="notice">此为原创练习，并非 SEAMO 官方真题或成绩预测。题量和时长按 2026 中国赛区 Pre-A 公布格式设计；参考公开低龄组例题编排。英文语音使用 iPad 浏览器提供的合成朗读声音。</div>`}
function saveStart(n){stopSpeech();const ex={paper:n,idx:0,answers:Array(15).fill(null),start:Date.now(),deadline:Date.now()+40*60*1000,finished:false};exam=ex;safePersist();renderExam();startTimer()}
function startTimer(){clearInterval(tickHandle);tickHandle=setInterval(()=>{if(!exam||exam.finished){clearInterval(tickHandle);return;}const remain=Math.max(0,exam.deadline-Date.now());let el=document.getElementById('timer');if(el){el.textContent=formatTime(remain);el.classList.toggle('urgent',remain<=300000)}if(remain<=0)submitExam(true)},500)}
function formatTime(ms){let seconds=Math.ceil(ms/1000);return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function diagram(v){const wrap=(inner)=>`<div class="viz" aria-hidden="true">${inner}</div>`;if(!v)return '';
if(v==='clock3'||v==='clock11') {let a=v==='clock3'?3:11;let rad=(a*30-90)*Math.PI/180;let hx=65+28*Math.cos(rad),hy=65+28*Math.sin(rad);return wrap(`<svg class="clock" viewBox="0 0 130 130"><circle cx="65" cy="65" r="58" fill="white" stroke="#315b91" stroke-width="5"/><text x="65" y="24" text-anchor="middle" fill="#193b69" font-size="16">12</text><text x="108" y="70" fill="#193b69" font-size="16">3</text><text x="60" y="117" fill="#193b69" font-size="16">6</text><text x="13" y="70" fill="#193b69" font-size="16">9</text><line x1="65" y1="65" x2="65" y2="31" stroke="#183d79" stroke-width="3" stroke-linecap="round"/><line x1="65" y1="65" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="#2076d7" stroke-width="6" stroke-linecap="round"/><circle cx="65" cy="65" r="5" fill="#173d76"/></svg>`)}
const presets={shapesA:'●  ▲  ●  ▲  ●  ?', pizza:'🍕 8  −  3  =  ?',sequenceA:'4 → 7 → 10 → 13 → ?',sequenceB:'2 → 4 → 8 → 10 → 14 → ?',animals:'🐈  🐕  🐦  🐈  🐕  🐦  …',animalsB:'🐟  🐦  🐟  🐦  🐟  ?',shapesB:'△     □     ▭',corners:'△   △   □',sweets:'🍬 × 14  ÷ 2',steps:'0 → 1 → 2 → 3 → 4 → 5',stickers:'👧  ?    👦  ?    🟰 12',shells:'🐚🐚🐚🐚  × 3  − 2',days:'Monday → Tuesday → Wednesday → ?',daysB:'Monday ← Tuesday ← Wednesday',dots:'●    ●    ●    ●    ●',digits:'1  2  3',pentagon:'△   □   ⬠',queue:'👧  👤  👤  👤  👤  👤  👤  👤'};
if(presets[v])return wrap(`<div class="visual-text ${presets[v].length>31?'visual-small':''}">${escapeHTML(presets[v])}</div>`);
if(v==='grid2')return wrap(`<div class="square-grid"><div></div><div></div><div></div><div></div></div>`);
if(v==='route')return wrap(`<div style="text-align:center"><div class="route-board"><div></div><div></div><div style="color:#14876d">🏁</div><div></div><div></div><div></div><div style="color:#2464cc">🤖</div><div></div><div></div></div><div class="visual-caption">→ right / 向右 2 &nbsp; ↑ up / 向上 2</div></div>`);
if(v==='sum10')return wrap(`<div class="boxmath"><span class="mathbox">4</span>+<span class="mathbox">6</span>= 10</div><div class="boxmath" style="width:100%;justify-content:center"><span class="mathbox">3</span>+<span class="mathbox blank">?</span>= 10</div>`);
if(v==='sum9')return wrap(`<div class="boxmath"><span class="mathbox">4</span>+<span class="mathbox blank">?</span>= 9</div>`);
if(v==='balanceA')return wrap(`<div class="emoji-tray">🍎🍎 <span class="separate">⚖️</span> 🍊🍊🍊🍊🍊🍊</div>`);
if(v==='balanceB')return wrap(`<div class="emoji-tray">🧸 = 🦆🦆 <span class="separate">|</span> 🦆 = 🍎🍎🍎</div>`);
if(v==='ribbons')return wrap(`<div class="ribbon-wrap">${[5,8,6].map((n,i)=>`<div class="ribbon-item"><span>${n} cm</span><div class="ribbon" style="width:${n*19}px;background:${['#69a4d5','#df915d','#90ba80'][i]}"></div></div>`).join('')}</div>`);
if(v==='matchesA'||v==='matchesB'){let count=v==='matchesA'?5:4;return wrap(`<div><div class="matchrow">${Array.from({length:count},()=>'<div></div>').join('')}</div><div class="visual-caption" style="margin-top:11px">共享边 · shared sides</div></div>`)}
if(v==='pyramid')return wrap(`<div class="pyramid"><div class="pyrrow"><div class="blank">?</div></div><div class="pyrrow"><div>5</div><div>7</div></div><div class="pyrrow"><div>2</div><div>3</div><div>4</div></div></div>`);
return ''}
function renderExam(){if(!exam)return;let q=PAPERS[exam.paper][exam.idx],idx=exam.idx;const answered=exam.answers.filter(x=>x!==null).length;app.innerHTML=`<div class="brand"><div class="logo">◈ SEAMO <span style="color:#4384e1">PRE‑A</span></div><div class="micro">模拟卷 ${exam.paper===0?'A':'B'}</div></div><div class="topbar"><div>${btn('← 返回首页','btn-outline tiny','home')}</div><div id="timer" class="timer">${formatTime(Math.max(0,exam.deadline-Date.now()))}</div></div><div class="panel" style="padding:15px 18px"><div class="stepbar"><span class="question-num">Question ${idx+1} / 15</span><span class="point-badge">${idx<10?'3':'4'} marks / 分</span><span class="micro">已答 ${answered}/15</span></div><div class="progress"><div style="width:${answered/15*100}%"></div></div><div class="dots">${exam.answers.map((a,i)=>`<button class="dot ${a!==null?'answered':''} ${idx===i?'current':''}" data-action="jump${i}" aria-label="第${i+1}题">${i+1}</button>`).join('')}</div></div><div class="panel question-panel"><div class="micro">${escapeHTML(q.topic)} · 英文＋中文</div><h2 class="q-en">${escapeHTML(q.en)}</h2><div class="q-zh">${escapeHTML(q.zh)}</div><div class="audio-row">${btn('🔊 朗读完整英文题目','btn-primary','speakEN')}${btn('🔈 中文朗读','btn-secondary','speakZH')}</div><div class="status" id="voiceStatus" aria-live="polite">点蓝色按钮聆听完整英文题目（可以重复播放）</div>${diagram(q.visual)}<div class="choices">${q.options.map((o,i)=>`<button class="choice ${exam.answers[idx]===i?'selected':''}" data-action="choose${i}" aria-pressed="${exam.answers[idx]===i}"><span class="circle">${'ABC'[i]}</span><span class="choice-text"><span>${escapeHTML(o.en)}</span><span class="choice-zh">${escapeHTML(o.zh)}</span></span></button>`).join('')}</div></div><div class="controls">${btn('← 上一题','btn-outline','prev',idx===0?'disabled':'')}${btn(idx===14?'检查答题 →':'下一题 →','btn-primary','next')}</div><div class="submit-area"><div class="micro">完成后统一交卷，交卷前不显示正确答案。</div>${btn('提交试卷','btn-danger','submit')}</div><p class="notice">英语朗读需要 iPad 浏览器支持语音合成；如无声音，请用 Safari 开启、调高媒体音量，并再次点蓝色朗读按钮。</p>`;}
function voice(lang){if(!exam)return;let q=PAPERS[exam.paper][exam.idx];if(!('speechSynthesis' in window)){let s=document.getElementById('voiceStatus');if(s)s.textContent='这个预览环境不支持朗读，请在 Safari 里开启网页版。';return;}stopSpeech();let msg=lang==='zh'?q.zh:q.say;let utter=new SpeechSynthesisUtterance(msg);utter.lang=lang==='zh'?'zh-CN':'en-US';utter.rate=lang==='zh'?.84:.83;utter.pitch=1;let voices=window.speechSynthesis.getVoices?.()||[];let preferred=voices.find(v=>v.lang?.toLowerCase().startsWith(utter.lang.toLowerCase().slice(0,2))&&(!v.localService||v.localService));if(preferred)utter.voice=preferred;const el=document.getElementById('voiceStatus');if(el)el.textContent=lang==='zh'?'正在朗读整条中文题目…':'正在朗读完整英文题目…';utter.onend=()=>{let s=document.getElementById('voiceStatus');if(s)s.textContent='朗读完成；可以点按钮重复播放。'};utter.onerror=()=>{let s=document.getElementById('voiceStatus');if(s)s.textContent='无法播放语音，请用 Safari 打开，并检查媒体音量及语音设置。'};try{window.speechSynthesis.speak(utter)}catch(e){if(el)el.textContent='当前环境无法朗读，请尝试 Safari。'}}
function showConfirm(){if(!exam)return;stopSpeech();const missed=exam.answers.filter(x=>x===null).length;const ok=window.confirm(missed?`还有 ${missed} 题没有作答。确定现在交卷吗？\n还有时间可以返回补答。`:'已经完成所有题目。确定交卷并查看成绩吗？');if(ok)submitExam(false)}
function submitExam(auto){if(!exam||exam.finished)return;stopSpeech();clearInterval(tickHandle);exam.finished=true;exam.auto=auto;safePersist();renderResults()}
function renderResults(){if(!exam)return;let qs=PAPERS[exam.paper],score=qs.reduce((a,q,i)=>a+(exam.answers[i]===q.key?(i<10?3:4):0),0),ncorrect=qs.filter((q,i)=>exam.answers[i]===q.key).length;app.innerHTML=`<div class="brand"><div class="logo">◈ SEAMO <span style="color:#4384e1">PRE‑A</span></div><div class="micro">Results / 成绩</div></div><header class="hero"><div class="eyebrow">模拟卷 ${exam.paper===0?'A':'B'} · 已交卷${exam.auto?' · 时间到自动提交':''}</div><h1>练习完成！</h1><div style="font-size:44px;font-weight:950;margin:6px 0">${score} <span style="font-size:21px;opacity:.7">/ 50</span></div><p>答对 ${ncorrect} / 15 题。此成绩只用于观察练习情况，并非官方获奖预测。</p></header><div class="panel"><h2>逐题答案与讲解</h2><p>绿色表示答对，红色表示需要复习。可以和小朋友一起读英文及中文解题方法。</p><div>${qs.map((q,i)=>{let correct=exam.answers[i]===q.key;let own=exam.answers[i]===null?'未作答 / Not answered':'ABC'[exam.answers[i]];let ans='ABC'[q.key];return `<div class="answer-review"><div class="review-meta ${correct?'correct':'incorrect'}">第 ${i+1} 题 · ${correct?'✓ 答对 Correct':'✕ 需要复习 Review'} · ${i<10?3:4}分题</div><div class="review-title">${escapeHTML(q.en)}</div><p>${escapeHTML(q.zh)}</p><p><b>你的答案 / Your answer: ${own}</b> &nbsp; | &nbsp; <b>正确答案 / Correct: ${ans} · ${escapeHTML(q.options[q.key].en)}</b></p><p>🇬🇧 ${escapeHTML(q.whyEN)}<br>🇨🇳 ${escapeHTML(q.whyZH)}</p></div>`}).join('')}</div></div><div class="controls">${btn('← 回到试卷首页','btn-primary','home')}${btn('再做一次本卷','btn-outline','restart')}</div><p class="notice">每卷按前10题每题3分，后5题每题4分模拟计分，总分50分，不扣错题分数。原创练习不代表真实 SEAMO 试题。</p>`;}
app.addEventListener('click',ev=>{let el=ev.target.closest('button[data-action]');if(!el)return;const act=el.dataset.action;if(act==='home'){if(exam&&!exam.finished&&!window.confirm('确定要退出吗？未提交的试卷会清除。'))return;showHome();return}if(act==='start0'||act==='start1'){saveStart(Number(act.slice(-1)));return}if(!exam)return;if(act==='speakEN')return voice('en');if(act==='speakZH')return voice('zh');if(act==='submit')return showConfirm();if(act==='restart')return saveStart(exam.paper);if(act.startsWith('choose')){exam.answers[exam.idx]=Number(act.slice(6));safePersist();renderExam();return}if(act.startsWith('jump')){exam.idx=Number(act.slice(4));stopSpeech();safePersist();renderExam();return}if(act==='prev'){exam.idx=Math.max(0,exam.idx-1);stopSpeech();safePersist();renderExam();return}if(act==='next'){if(exam.idx===14){showConfirm();return}exam.idx++;stopSpeech();safePersist();renderExam()}});
try{const raw=localStorage.getItem('seamo-prea-exam-v2');if(raw){let obj=JSON.parse(raw);if(obj&&Number.isInteger(obj.paper)&&[0,1].includes(obj.paper)&&Array.isArray(obj.answers)&&obj.answers.length===15){exam=obj;}}}catch(e){}
if(exam){if(exam.finished)renderResults();else if(Date.now()>exam.deadline)submitExam(true);else{renderExam();startTimer()}}else showHome();
</script></body></html>
