-numeric:tabular-nums;font-weight:800}.timer.warn{background:#fff0e9;color:#ba452e}.stepbar{display:flex;flex-wrap:wrap;gap:7px;justify-content:space-between;align-items:center;font-weight:750}.progress{height:8px;background:#e5ecf5;border-radius:30px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:#2a7cd6;transition:width .2s}.dots{display:flex;flex-wrap:wrap;gap:6px}.dot{width:35px;height:35px;background:white;border:1px solid #c5d1e1;color:#58667a;border-radius:9px;font-weight:760}.dot.done{background:#dcece3;border-color:#68b79a;color:#126b50}.dot.current{background:#185eb2;border-color:#185eb2;color:white}.qtype{display:inline-block;color:#2058a6;background:#eaf2ff;border-radius:30px;padding:6px 10px;font-size:12px;font-weight:800}.q-en{font-weight:850;line-height:1.42;font-size:clamp(23px,4vw,30px);margin:15px 0 10px}.q-zh{font-size:17px;color:#586a7e;line-height:1.65}.audiorow{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.audio-status{min-height:20px;font-size:12px;color:#63748a;margin-top:7px}.diagram{margin:18px 0;border:1px solid #deebf8;background:#f7faff;border-radius:15px;min-height:120px;padding:17px 10px;text-align:center;display:flex;justify-content:center;align-items:center;overflow:hidden}.diagram svg{max-width:100%;height:auto;display:block}.bigmath{font-weight:900;color:#1c5799;font-size:clamp(24px,5vw,39px);letter-spacing:1px;white-space:normal}.vlines{display:grid;gap:10px;font-size:clamp(21px,5vw,30px);font-weight:850;color:#124c88}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{border:2px solid #e0e7f1;border-radius:14px;background:#fff;text-align:left;padding:13px 14px;display:flex;align-items:center;gap:12px;min-height:66px;color:#243b58;font-size:19px;font-weight:750}.option.selected{border-color:#2276d9;background:#edf5ff}.letter{display:flex;align-items:center;justify-content:center;background:#e9f0fa;color:#25578e;min-width:35px;height:35px;border-radius:50%;font-size:15px}.option.selected .letter{background:#216cd0;color:white}.numbox{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.numbox input{font-size:30px;padding:12px;width:200px;max-width:100%;text-align:center;border:2px solid #aabfd5;border-radius:13px;background:#fff;font-weight:800}.numbox input:focus{border-color:#2274d8}.controls{display:flex;justify-content:space-between;gap:12px;margin:12px 0}.controls .btn{min-width:120px}.answer-review{border-top:1px solid var(--line);padding:18px 0}.answer-review h3{font-size:17px;margin:8px 0}.status-good{color:var(--green);font-weight:800}.status-bad{color:var(--red);font-weight:800}.review-math{margin:7px 0;font-weight:760}.resultscore{font-weight:900;font-size:54px}.res-score-sub{font-size:22px;opacity:.8}.footer{margin-top:18px;color:var(--muted);font-size:12px;line-height:1.65}@media(max-width:610px){.wrap{padding:13px 12px 35px}.hero{padding:24px 19px}.cards,.options{grid-template-columns:1fr}.panel{padding:16px}.card{padding:17px}.btn{padding:11px 12px}.dot{width:32px;height:32px}.q-en{font-size:24px}.audiorow .btn{flex:1}.numbox input{width:100%}}

<script>
const PAPERS=[[{"en":"Each apple weighs 4 units. One apple and two pears weigh 14 units. How much do one apple and one pear weigh?","zh":"每个苹果重4单位。1个苹果和2个梨一共重14单位。1个苹果加1个梨一共重多少？","choices":["7","8","9","10"],"answer":2,"topic":"Balance & algebra","visual":{"type":"balance","lines":["🍎 = 4","🍎 + 🍐 + 🍐 = 14","🍎 + 🍐 = ?"]},"speech":"An apple weighs four units. One apple and two pears weigh fourteen units. How much do one apple and one pear weigh together?","ex_en":"Two pears weigh 10, so each pear weighs 5. 4 + 5 = 9.","ex_zh":"2个梨共重10，所以每个梨重5；4＋5＝9。","base":"K"},{"en":"The ant can move only right or up along the arrows. How many different paths lead from START to HOME?","zh":"小蚂蚁只能沿箭头向右或向上走。从起点到家一共有多少条不同路线？","choices":["2","3","4","5"],"answer":1,"topic":"Routes & logic","visual":{"type":"path","right":2,"up":1},"speech":"An ant starts in the bottom left corner of a grid with two steps to the right and one step up. It may move only right or up. How many different paths lead to the top right corner?","ex_en":"There are 3 paths: up-right-right, right-up-right and right-right-up.","ex_zh":"共有3条路线：先上、先走一格右再上、或者最右边才向上。","base":"K"},{"en":"How many corners does the yellow shape have?","zh":"黄色图形有多少个角？","choices":["4","5","6","7"],"answer":1,"topic":"Geometry","visual":{"type":"polygon","n":5},"speech":"How many corners does the yellow shape have? Count every sharp corner.","ex_en":"This pentagon has exactly 5 corners.","ex_zh":"这个五边形有5个角。","base":"K"},{"en":"Find the missing number: 2, 3, 5, 8, 13, __.","zh":"找出缺少的数字：2、3、5、8、13、__。","choices":["16","18","20","21"],"answer":3,"topic":"Number patterns","visual":{"type":"sequence","items":["2","3","5","8","13","?"]},"speech":"Find the missing number in the pattern: two, three, five, eight, thirteen, what comes next?","ex_en":"Each new number is the sum of the previous two. 8 + 13 = 21.","ex_zh":"每个新数字等于前两个数字相加。8＋13＝21。","base":"K"},{"en":"The two sides of the balance are equal. Find the missing number: 3 + □ = 6 + 2.","zh":"天平两边相等。3＋□＝6＋2，问号是多少？","choices":["4","5","6","7"],"answer":1,"topic":"Equations","visual":{"type":"equation","text":"3 + ? = 6 + 2"},"speech":"The two sides of the balance are equal. Three plus a missing number equals six plus two. What is missing?","ex_en":"6 + 2 = 8. To make 3 + ? = 8, the missing number is 5.","ex_zh":"6＋2＝8，所以3＋5＝8。","base":"K"},{"en":"How many squares of all sizes are in the grid?","zh":"这个方格图中一共有多少个正方形？（大、小都算）","choices":["4","5","6","8"],"answer":1,"topic":"Counting shapes","visual":{"type":"grid","cols":2,"rows":2},"speech":"Count all the squares in the two by two grid, including both small squares and big squares.","ex_en":"There are 4 little squares and 1 big square, for 5 total.","ex_zh":"4个小正方形，加1个大正方形，共5个。","base":"A"},{"en":"Each circle has four numbers that add up to 18. What is the missing number?","zh":"每个圆圈里的4个数字相加都等于18。问号是多少？","choices":["2","3","4","5"],"answer":1,"topic":"Number relationship","visual":{"type":"circle","items":[[2,5,7,4],[6,3,4,5],[6,4,5,"?"]]},"speech":"Each circle has four numbers that add up to eighteen. In the last circle the numbers are six, four, five and a missing number. What is missing?","ex_en":"6 + 4 + 5 = 15, and 18 − 15 = 3.","ex_zh":"6＋4＋5＝15，18－15＝3。","base":"A"},{"en":"Look at the coloured beads. Which colour comes next?","zh":"观察彩色珠子规律。下一个珠子是什么颜色？","choices":["Red","Blue","Green","Yellow"],"answer":1,"topic":"Colour logic","visual":{"type":"beads","colors":["red","blue","red","blue","red","?"]},"speech":"The colours are red, blue, red, blue, red. What colour comes next?","ex_en":"The colours alternate red, blue. Next is blue.","ex_zh":"颜色按红、蓝交替出现，下一个是蓝色。","base":"A"},{"en":"You have one 2-point token and two 5-point tokens. Using at least one token, how many different positive totals can you make?","zh":"你有1个面值2的筹码和2个面值5的筹码。至少用1个，可组成多少种不同的正整数总分？","choices":["4","5","6","7"],"answer":1,"topic":"Combinations","visual":{"type":"coins","values":[2,5,5]},"speech":"You have one token worth two points and two tokens worth five points each. You may use one, two, or three tokens. How many different positive totals can you make?","ex_en":"The different totals are 2, 5, 7, 10 and 12. There are 5.","ex_zh":"可以组成2、5、7、10、12，共5种。","base":"A"},{"en":"Mia has 9 stickers. She gives 2 away and then gets 4 new stickers. How many stickers does she have now?","zh":"米娅原来有9张贴纸，送出2张，又得到4张。现在有多少张？","choices":["9","10","11","12"],"answer":2,"topic":"Word problems","visual":{"type":"equation","text":"9 − 2 + 4 = ?"},"speech":"Mia has nine stickers. She gives two away and then gets four new stickers. How many does she have now?","ex_en":"9 − 2 + 4 = 11.","ex_zh":"9－2＋4＝11。","base":"K"},{"en":"9 + □ = 16. What number belongs in the box?","zh":"9＋□＝16。方框里应该填什么数字？","answer":"7","topic":"Equations","visual":{"type":"equation","text":"9 + ? = 16"},"speech":"Nine plus what number equals sixteen?","ex_en":"16 − 9 = 7.","ex_zh":"16－9＝7。","base":"K"},{"en":"How many squares of all sizes are in this 3 by 2 grid?","zh":"这个3列2行的方格图里，一共有多少个正方形？","answer":"8","topic":"Counting shapes","visual":{"type":"grid","cols":3,"rows":2},"speech":"Count all the squares in a three column by two row grid, including squares of all sizes.","ex_en":"There are 6 small squares and 2 squares of size 2 by 2. Total 8.","ex_zh":"6个小正方形，另有2个2×2的大正方形，共8个。","base":"A"},{"en":"A train leaves at 3 o’clock. It arrives 2 hours later. At what o’clock does it arrive? Enter the hour only.","zh":"火车3点出发，2小时后到达。到达时是几点？只填小时数字。","answer":"5","topic":"Time","visual":{"type":"equation","text":"3 o’clock + 2 hours = ?"},"speech":"A train leaves at three o clock. It arrives two hours later. At what o clock does it arrive? Enter just the hour.","ex_en":"3 o’clock + 2 hours = 5 o’clock.","ex_zh":"3点加2小时等于5点。","base":"K"},{"en":"A tower has 5 blocks on the bottom row, 4 on the next row, and 3 on the top row. How many blocks are there altogether?","zh":"积木塔最底层5块、中间4块、最上层3块。一共有多少块？","answer":"12","topic":"Visual counting","visual":{"type":"blocks","rows":[3,4,5]},"speech":"A tower has five blocks in the bottom row, four blocks above it, and three blocks on top. How many blocks are there in total?","ex_en":"5 + 4 + 3 = 12.","ex_zh":"5＋4＋3＝12。","base":"K"},{"en":"Find the missing number: 7, 10, 13, 16, __.","zh":"找出缺少的数字：7、10、13、16、__。","answer":"19","topic":"Number patterns","visual":{"type":"sequence","items":["7","10","13","16","?"]},"speech":"Find the missing number: seven, ten, thirteen, sixteen. What number comes next?","ex_en":"Each step adds 3. 16 + 3 = 19.","ex_zh":"每次加3：16＋3＝19。","base":"K"}],[{"en":"Two apples weigh 8 units. One apple and two pears weigh 14 units. How much do two apples and one pear weigh?","zh":"2个苹果共重8单位。1个苹果加2个梨共重14单位。2个苹果加1个梨共重多少？","choices":["11","12","13","14"],"answer":2,"topic":"Balance & algebra","visual":{"type":"balance","lines":["🍎 + 🍎 = 8","🍎 + 🍐 + 🍐 = 14","🍎 + 🍎 + 🍐 = ?"]},"speech":"Two apples weigh eight units. An apple and two pears weigh fourteen units. How much do two apples and one pear weigh?","ex_en":"One apple = 4. One pear = 5. Two apples and one pear = 4 + 4 + 5 = 13.","ex_zh":"每个苹果重4，每个梨重5，所以4＋4＋5＝13。","base":"K"},{"en":"A robot can move only right or up. How many different paths lead from START to HOME?","zh":"机器人只能向右或向上移动。从起点到终点，有多少条不同的路线？","choices":["6","8","10","12"],"answer":2,"topic":"Routes & logic","visual":{"type":"path","right":3,"up":2},"speech":"A robot starts at the bottom left corner of a grid. It must go three steps right and two steps up. It may make only right or up moves. How many different paths lead to the top right corner?","ex_en":"The possible orders of 3 right moves and 2 up moves make 10 routes.","ex_zh":"在总共5步中决定哪2步向上，余下3步向右，一共有10种路线。","base":"K"},{"en":"How many corners does the blue shape have?","zh":"蓝色图形有多少个角？","choices":["5","6","7","8"],"answer":1,"topic":"Geometry","visual":{"type":"polygon","n":6},"speech":"Count the corners of the blue shape. How many corners does it have?","ex_en":"A hexagon has 6 corners.","ex_zh":"六边形共有6个角。","base":"K"},{"en":"Find the missing number: 1, 3, 4, 7, 11, __.","zh":"找出缺少的数字：1、3、4、7、11、__。","choices":["15","17","18","22"],"answer":2,"topic":"Number patterns","visual":{"type":"sequence","items":["1","3","4","7","11","?"]},"speech":"Find the missing number in the pattern: one, three, four, seven, eleven. What comes next?","ex_en":"Add the previous two numbers: 7 + 11 = 18.","ex_zh":"后一项是前两项之和：7＋11＝18。","base":"K"},{"en":"Find the missing number: □ + 3 = 2 + 7.","zh":"找出缺少的数字：□＋3＝2＋7。","choices":["5","6","7","8"],"answer":1,"topic":"Equations","visual":{"type":"equation","text":"? + 3 = 2 + 7"},"speech":"A missing number plus three is equal to two plus seven. What is the missing number?","ex_en":"2 + 7 = 9. Then ? = 9 − 3 = 6.","ex_zh":"2＋7＝9；9－3＝6。","base":"K"},{"en":"How many rectangles of all sizes are in the 2 by 2 grid? Squares count as rectangles.","zh":"在2列2行的方格中，一共有多少个长方形？正方形也算长方形。","choices":["6","8","9","10"],"answer":2,"topic":"Counting shapes","visual":{"type":"grid","cols":2,"rows":2},"speech":"Count all rectangles of all sizes in a two by two grid. Squares count as rectangles.","ex_en":"Choose 2 of the 3 vertical lines and 2 of the 3 horizontal lines: 3 × 3 = 9.","ex_zh":"从3条竖线中选2条、3条横线中选2条，共3×3＝9个。","base":"A"},{"en":"In every circle the four numbers add up to 22. Find the missing number.","zh":"每个圆里4个数的和都等于22。找出缺少的数字。","choices":["6","7","8","9"],"answer":1,"topic":"Number relationship","visual":{"type":"circle","items":[[5,8,4,5],[7,6,2,7],[8,4,3,"?"]]},"speech":"The four numbers in every circle add up to twenty two. In the last circle the numbers are eight, four, three and a missing number. What is missing?","ex_en":"8 + 4 + 3 = 15. 22 − 15 = 7.","ex_zh":"8＋4＋3＝15；22－15＝7。","base":"A"},{"en":"The coloured beads repeat red, blue, green. Which colour comes next?","zh":"珠子的颜色按红、蓝、绿重复。下一个是什么颜色？","choices":["Red","Blue","Green","Yellow"],"answer":2,"topic":"Colour logic","visual":{"type":"beads","colors":["red","blue","green","red","blue","?"]},"speech":"The colours repeat red, blue, green, red, blue. Which colour comes next?","ex_en":"The next colour in the repeating cycle is green.","ex_zh":"红、蓝、绿按顺序重复，因此下一个是绿色。","base":"A"},{"en":"You have two 3-point tokens and one 4-point token. How many different positive totals can you make using at least one token?","zh":"你有2个面值3的筹码和1个面值4的筹码。至少使用1个，可组成多少种不同的正整数总分？","choices":["4","5","6","7"],"answer":1,"topic":"Combinations","visual":{"type":"coins","values":[3,3,4]},"speech":"You have two tokens worth three points each and one token worth four points. How many different positive totals can you make using at least one token?","ex_en":"The possible totals are 3, 4, 6, 7, 10. That is 5 different totals.","ex_zh":"不同总分是3、4、6、7、10，共5种。","base":"A"},{"en":"Tina has 8 marbles. Ben has twice as many. How many marbles do they have altogether?","zh":"蒂娜有8颗弹珠，本有她的2倍。他们一共有多少颗？","choices":["16","20","24","28"],"answer":2,"topic":"Word problems","visual":{"type":"equation","text":"8 + (8 + 8) = ?"},"speech":"Tina has eight marbles. Ben has twice as many marbles as Tina. How many do they have altogether?","ex_en":"Ben has 16. Together they have 8 + 16 = 24.","ex_zh":"本有16颗，两人共8＋16＝24颗。","base":"A"},{"en":"Five squares stand in one straight row, sharing sides. How many matchsticks are needed to make all five squares?","zh":"用火柴并排搭5个共用边的正方形，需要多少根火柴？","answer":"16","topic":"Shape patterns","visual":{"type":"matchsticks","n":5},"speech":"Five squares stand side by side in one row, sharing their sides. How many matchsticks are needed to build them?","ex_en":"The first square needs 4; the next 4 squares each add 3. 4 + 4 × 3 = 16.","ex_zh":"第1个用4根，之后每个再加3根，4＋4×3＝16。","base":"A"},{"en":"How many squares of all sizes are in this 3 by 2 grid?","zh":"数出这个3列2行方格里所有大小的正方形，共多少个？","answer":"8","topic":"Counting shapes","visual":{"type":"grid","cols":3,"rows":2},"speech":"How many squares of all sizes are in this grid with three columns and two rows?","ex_en":"6 small squares plus 2 squares of size 2 by 2 equals 8.","ex_zh":"6个1×1方格加2个2×2方格，共8个。","base":"A"},{"en":"I am a two-digit number. My tens digit is 4. My ones digit is 3 more than my tens digit. What number am I?","zh":"我是一个两位数，十位是4，个位比十位大3。我是多少？","answer":"47","topic":"Place value","visual":{"type":"equation","text":"Tens = 4 · Ones = 4 + 3"},"speech":"I am a two-digit number. My tens digit is four. My ones digit is three more than my tens digit. What number am I?","ex_en":"The ones digit is 7 and the tens digit is 4, so the number is 47.","ex_zh":"个位是4＋3＝7，十位是4，所以是47。","base":"A"},{"en":"There are 12 cats and dogs at a shelter. Eight are cats. How many are dogs?","zh":"宠物收容所有12只猫和狗，其中8只是猫。有多少只狗？","answer":"4","topic":"Word problems","visual":{"type":"equation","text":"12 − 8 = ?"},"speech":"There are twelve cats and dogs at a shelter. Eight are cats. How many are dogs?","ex_en":"12 − 8 = 4 dogs.","ex_zh":"12－8＝4只狗。","base":"K"},{"en":"Ben has 4 counters. Ella has 3 more counters than Ben. How many counters do they have altogether?","zh":"本有4个计数片，艾拉比本多3个。他们一共有多少个？","answer":"11","topic":"Word problems","visual":{"type":"equation","text":"4 + (4 + 3) = ?"},"speech":"Ben has four counters. Ella has three more counters than Ben. How many counters do they have altogether?","ex_en":"Ella has 7. Together: 4 + 7 = 11.","ex_zh":"艾拉有4＋3＝7个，一共4＋7＝11个。","base":"A"}]];

<div class="header"><div class="logo">◈ SEAMO <span style="color:#2267ae">Pre-A</span></div><div class="small">Sample-inspired · 中英双语</div></div>
<header class="hero"><div style="letter-spacing:2px;opacity:.82;font-weight:750;font-size:12px">IPAD INTERACTIVE PRACTICE</div><h1>SEAMO Pre-A<br>官方样题风格练习</h1><p>根据 SEAMO 官方 Paper K 和 Paper A 样题的题型，重新设计两套原创模拟卷。题目不是官方真题。</p><div class="pills"><span class="pill">40 分钟</span><span class="pill">10 道选择题 + 5 道填空题</span><span class="pill">🇬🇧 整题英语朗读</span><span class="pill">🇨🇳 简体中文对照</span></div></header>
<div class="panel"><h2>选择一份试卷</h2><div class="cards"><div class="card"><span class="tag">基础 · Paper K 为主</span><h3>模拟卷 1</h3><p class="muted">天平推理、路径、图形、规律、数方格，以及少量 Paper A 题型。</p>${btn('开始模拟卷 1 →','primary','start0')}</div><div class="card"><span class="tag">进阶 · Paper A 比例提高</span><h3>模拟卷 2</h3><p class="muted">结合难一点的路径、组合、图形计数和数字推理，适合作为冲刺练习。</p>${btn('开始模拟卷 2 →','primary','start1')}</div></div></div>
<div class="panel"><h2>官方 PDF · Original SEAMO samples</h2><p class="muted">以下两个链接打开真实官方样题原件（各含5道示例题与答案），不是历年完整试卷。</p><div class="resources"><a target="_blank" rel="noopener" href="${OFFICIAL_K}">↗ SEAMO Paper K 样题 PDF</a><a target="_blank" rel="noopener" href="${OFFICIAL_A}">↗ SEAMO Paper A 样题 PDF</a></div><p class="notice">Paper K 是幼儿组，Paper A 是国际版低年级组；两者都不等于中国赛区 2026 Pre-A 真题。本练习只借鉴题型，难度与评分不能预测正式比赛结果。</p></div>
<div class="panel"><h2>考试规则 · Instructions</h2><p>第一部分 Q1–Q10：选择一个正确选项。第二部分 Q11–Q15：自行输入数字答案（不是选择题）。可以重复点击🔊听完整英文题目和选项。交卷后才会显示答案与解题步骤。</p><p class="notice">建议让孩子使用 Safari，保持 iPad 媒体音量打开。网页朗读取决于设备可用的系统语音。如果语音按钮没有声音，请确认系统语音支持并使用 Safari 再试。</p></div><div class="footer">原创练习 · 不隶属于 SEAMO、TCIMO 或阿思丹。官方样题版权归其权利人所有。</div>`}
function begin(p){stopSpeech();clearInterval(ticker);exam={paper:p,answers:Array(15).fill(null),idx:0,end:Date.now()+40*60*1000,done:false,expired:false};save();renderQ();runTimer()}
function runTimer(){clearInterval(ticker);ticker=setInterval(()=>{if(!exam||exam.done){clearInterval(ticker);return;}let left=Math.floor((exam.end-Date.now())/1000);if(left<=0){finish(true);return;}let t=document.getElementById('timer');if(t){t.textContent=numtime(left);t.classList.toggle('warn',left<300)}},250)}
function diagram(v){if(!v)return '';let t=v.type;let svg=(s,view='0 0 490 185')=>`<div class="diagram"><svg viewBox="${view}" width="490" role="img" aria-label="maths illustration">${s}</svg></div>`;
if(t==='equation')return `<div class="diagram"><div class="bigmath">${esc(v.text)}</div></div>`;
if(t==='balance')return `<div class="diagram"><div class="vlines">${v.lines.map(x=>`<div>${esc(x)}</div>`).join('')}</div></div>`;
if(t==='sequence')return svg(v.items.map((a,i)=>{let cx=42+i*(407/Math.max(1,v.items.length-1));return `<circle cx="${cx}" cy="86" r="31" fill="white" stroke="#3876bc" stroke-width="3"/><text x="${cx}" y="97" font-size="25" text-anchor="middle" fill="#1c5494" font-weight="bold">${esc(a)}</text>`}).join(''));
if(t==='polygon'){let n=v.n,cy=90,cx=245,R=65;let pts=Array.from({length:n},(_,i)=>{let angle=(i/n)*Math.PI*2-Math.PI/2;return `${cx+R*Math.cos(angle)},${cy+R*Math.sin(angle)}`}).join(' ');return svg(`<polygon points="${pts}" fill="${n===6?'#86bef7':'#f8e17d'}" stroke="#1c497d" stroke-width="5"/>`)}
if(t==='grid'){let w=v.cols*53,h=v.rows*53,l=(490-w)/2,top=(185-h)/2;let a=`<rect x="${l}" y="${top}" width="${w}" height="${h}" fill="#f9fbff" stroke="#1a5398" stroke-width="3"/>`;for(let i=1;i<v.cols;i++)a+=`<line x1="${l+i*53}" y1="${top}" x2="${l+i*53}" y2="${top+h}" stroke="#1a5398" stroke-width="3"/>`;for(let j=1;j<v.rows;j++)a+=`<line x1="${l}" y1="${top+j*53}" x2="${l+w}" y2="${top+j*53}" stroke="#1a5398" stroke-width="3"/>`;return svg(a)}
if(t==='path'){let n=v.right,m=v.up,g=Math.min(67,300/n,115/m),l=(490-n*g)/2,top=(185-m*g)/2;let a='';for(let i=0;i<=n;i++)for(let j=0;j<=m;j++){let x=l+i*g,y=top+j*g;if(i<n)a+=`<line x1="${x}" y1="${y}" x2="${x+g}" y2="${y}" stroke="#6f95c5" stroke-width="3"/><path d="M ${x+g*.67-4} ${y-5} L ${x+g*.67+4} ${y} L ${x+g*.67-4} ${y+5}" fill="none" stroke="#1b5da6" stroke-width="2.6"/>`;if(j<m)a+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${y+g}" stroke="#6f95c5" stroke-width="3"/><path d="M ${x-5} ${y+g*.33+4} L ${x} ${y+g*.33-4} L ${x+5} ${y+g*.33+4}" fill="none" stroke="#1b5da6" stroke-width="2.6"/>`;}a+=`<circle cx="${l}" cy="${top+m*g}" r="8" fill="#e18052"/><circle cx="${l+n*g}" cy="${top}" r="8" fill="#37a17e"/><text x="${l-10}" y="${top+m*g+23}" font-size="12" text-anchor="middle" fill="#a7502c">START</text><text x="${l+n*g+20}" y="${top-9}" font-size="12" text-anchor="middle" fill="#198264">HOME</text>`;return svg(a)}
if(t==='circle'){let a='';v.items.forEach((c,i)=>{let cx=95+i*150,cy=93,r=63;a+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="white" stroke="#db7775" stroke-width="2.5"/><path d="M ${cx-r} ${cy} H ${cx+r} M ${cx} ${cy-r} V ${cy+r}" stroke="#db7775" stroke-width="2"/>`;[[cx-25,cy-20],[cx+24,cy-20],[cx-25,cy+34],[cx+24,cy+34]].forEach(([x,y],k)=>a+=`<text x="${x}" y="${y}" text-anchor="middle" font-weight="bold" fill="#b14843" font-size="23">${esc(c[k])}</text>`)});return svg(a)}
if(t==='beads'){let col={red:'#e45a55',blue:'#4499dd',green:'#56bd79',yellow:'#f7c842','?':'#fff'};let a=v.colors.map((c,i)=>{let cx=48+i*80;return `<circle cx="${cx}" cy="90" r="27" fill="${col[c]}" stroke="#376088" stroke-width="2"/>${c==='?'?`<text x="${cx}" y="101" font-size="34" font-weight="bold" text-anchor="middle" fill="#28517f">?</text>`:''}`}).join('');return svg(a)}
if(t==='coins'){let a=v.values.map((k,i)=>{let cx=135+i*105;return `<circle cx="${cx}" cy="93" r="40" fill="#ffe39c" stroke="#c29a3e" stroke-width="4"/><circle cx="${cx}" cy="93" r="34" fill="none" stroke="#d6ad4f" stroke-width="1.5"/><text x="${cx}" y="107" font-size="39" font-weight="bold" text-anchor="middle" fill="#855918">${k}</text>`}).join('');return svg(a)}
if(t==='blocks'){let a='';v.rows.forEach((k,j)=>{let left=(490-k*35)/2,top=23+j*45;for(let i=0;i<k;i++)a+=`<rect x="${left+i*35}" y="${top}" width="34" height="34" rx="3" fill="${j===0?'#e8a363':j===1?'#91bbdb':'#90c0a5'}" stroke="#437197" stroke-width="2"/>`});return svg(a)}
if(t==='matchsticks'){let n=v.n,l=(490-n*65)/2,top=51,a='';for(let i=0;i<n;i++){a+=`<rect x="${l+i*65}" y="${top}" width="65" height="65" fill="#f1f8ff" stroke="#b2763a" stroke-width="5"/>`}return svg(a)}return ''}
function currentAnswered(){return exam.answers.filter(x=>x!==null&&x!=='').length}
function renderQ(){if(!exam||exam.done)return;let q=PAPERS[exam.paper][exam.idx],idx=exam.idx,multi=idx<10,answered=currentAnswered();app.innerHTML=`<div class="header"><div class="logo">◈ SEAMO <span style="color:#2368ab">Pre-A</span></div><div class="small">原创模拟卷 ${exam.paper+1}</div></div><div class="topbar">${btn('← 返回首页','outline','home')}<div class="timer" id="timer">${numtime(Math.ceil((exam.end-Date.now())/1000))}</div></div><div class="panel" style="margin-top:12px;padding:16px"><div class="stepbar"><span>Question ${idx+1} / 15</span><span class="small">${multi?'选择题 · Multiple choice':'填空题 · Number entry'}</span><span class="small">已答 ${answered}/15</span></div><div class="progress"><div style="width:${answered/15*100}%"></div></div><div class="dots">${exam.answers.map((a,i)=>`<button class="dot ${a!==null&&a!==''?'done':''} ${idx===i?'current':''}" data-action="jump${i}" aria-label="第${i+1}题">${i+1}</button>`).join('')}</div></div><section class="panel"><span class="qtype">${esc(q.topic)} · ${q.base==='K'?'参考 Paper K 题型':'参考 Paper A 题型'}</span><h2 class="q-en">${esc(q.en)}</h2><div class="q-zh">${esc(q.zh)}</div><div class="audiorow">${btn('🔊 读完整英文题目','primary','speakEN')}${btn('🔈 读中文题目','pale','speakZH')}</div><div class="audio-status" id="voice-status" aria-live="polite">点按钮朗读整题${multi?'和全部选项':''}。</div>${diagram(q.visual)}${multi?`<div class="options">${q.choices.map((o,i)=>`<button class="option ${exam.answers[idx]===i?'selected':''}" data-action="choose${i}" aria-pressed="${exam.answers[idx]===i}"><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`:`<div class="numbox"><label for="numberInput"><strong>答案 / Answer</strong></label><input id="numberInput" type="number" inputmode="numeric" autocomplete="off" placeholder="填写数字" min="0" step="1" value="${exam.answers[idx]??''}" /></div><p class="notice">请直接输入数字，不必输入单位。Enter a number only.</p>`}</section><div class="controls">${btn('← 上一题','outline','prev',idx===0)}${btn(idx===14?'检查并交卷 →':'下一题 →','primary','next')}</div><div style="text-align:center;margin-top:10px">${btn('提交试卷','danger','submit')}</div><p class="notice">正式练习计时40分钟，到时自动交卷。交卷前不显示答案。</p>`}
function speak(lang){let q=PAPERS[exam.paper][exam.idx];if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){document.getElementById('voice-status').textContent='这个浏览器不支持语音，请使用 iPad Safari。';return;}stopSpeech();let words=lang==='en'?q.speech+(exam.idx<10?'. Answer choices. '+q.choices.map((v,i)=>'Option '+ 'ABCD'[i]+', '+v).join('. '):''):q.zh+(exam.idx<10?' 选项：'+q.choices.map((v,i)=>'选项'+'ABCD'[i]+'，'+v).join('；'):'');let u=new SpeechSynthesisUtterance(words);u.lang=lang==='en'?'en-US':'zh-CN';u.rate=lang==='en'?0.82:0.86;const voices=window.speechSynthesis.getVoices?.()||[];let voice=voices.find(v=>v.lang?.toLowerCase().startsWith(lang==='en'?'en':'zh'));if(voice)u.voice=voice;let info=document.getElementById('voice-status');info.textContent='正在朗读…';u.onend=()=>{let x=document.getElementById('voice-status');if(x)x.textContent='朗读完成，可以再听一次。'};u.onerror=()=>{let x=document.getElementById('voice-status');if(x)x.textContent='语音播放失败。请用 Safari 打开网页并检查音量。'};try{window.speechSynthesis.speak(u)}catch(e){info.textContent='无法启动朗读，请再点一次。'}}
function finish(expired){if(!exam||exam.done)return;stopSpeech();clearInterval(ticker);exam.done=true;exam.expired=expired;save();results()}
function confirmSubmit(){let unanswered=15-currentAnswered();if(window.confirm(unanswered?`还有 ${unanswered} 道题没做，确定提交吗？`:'已经回答所有题目，确定提交并查看答案吗？'))finish(false)}
function results(){let qs=PAPERS[exam.paper],correct=qs.reduce((a,q,i)=>a+(i<10?exam.answers[i]===q.answer:String(exam.answers[i]??'').trim()===q.answer),0);let missed=qs.map((q,i)=>i<10?exam.answers[i]!==q.answer:String(exam.answers[i]??'').trim()!==q.answer);app.innerHTML=`<div class="header"><div class="logo">◈ SEAMO Pre-A</div><div class="small">Practice results</div></div><header class="hero"><div style="font-size:13px;font-weight:750">模拟卷 ${exam.paper+1} · ${exam.expired?'时间到自动交卷':'已交卷'}</div><h1>练习完成</h1><div class="resultscore">${correct} <span class="res-score-sub">/ 15 题答对</span></div><p>下面可以逐题查看正确答案及简短解法。此分数不是官方成绩或获奖预测。</p></header><section class="panel"><h2>逐题复习 · Review</h2>${qs.map((q,i)=>{let yes=!missed[i];let actual=exam.answers[i];return `<div class="answer-review"><div class="${yes?'status-good':'status-bad'}">第 ${i+1} 题 ${yes?'✓ 正确':'✕ 需要复习'} · ${esc(q.topic)}</div><h3>${esc(q.en)}</h3><div class="muted">${esc(q.zh)}</div><p class="review-math">你的答案：${actual===null||actual===''?'未作答':i<10?('ABCD'[actual]+' · '+esc(q.choices[actual])):esc(actual)}<br>正确答案：${i<10?('ABCD'[q.answer]+' · '+esc(q.choices[q.answer])):esc(q.answer)}</p><p class="muted">🇬🇧 ${esc(q.ex_en)}</p><p class="muted">🇨🇳 ${esc(q.ex_zh)}</p></div>`}).join('')}</section><div class="controls">${btn('← 返回首页','primary','home')}${btn('再做一次','outline','restart')}</div><p class="footer">全部为原创题。官方 Paper K、A PDF 仅作题型参考。</p>`}
app.addEventListener('click',ev=>{let b=ev.target.closest('button[data-action]');if(!b)return;let a=b.dataset.action;if(a==='home'){if(exam&&!exam.done&&!window.confirm('确定离开吗？现在的模拟考试会清除。'))return;mainPage();return}if(a==='start0'||a==='start1'){begin(Number(a.slice(-1)));return}if(!exam)return;if(a==='speakEN')return speak('en');if(a==='speakZH')return speak('zh');if(a==='submit')return confirmSubmit();if(a==='restart')return begin(exam.paper);if(a.startsWith('choose')){exam.answers[exam.idx]=Number(a.slice(6));save();renderQ();return}if(a.startsWith('jump')){stopSpeech();exam.idx=Number(a.slice(4));save();renderQ();return}if(a==='prev'){stopSpeech();exam.idx=Math.max(0,exam.idx-1);save();renderQ();return}if(a==='next'){if(exam.idx===14)return confirmSubmit();stopSpeech();exam.idx++;save();renderQ();return}});
app.addEventListener('input',ev=>{if(ev.target.id==='numberInput'&&exam&&!exam.done){let val=ev.target.value;exam.answers[exam.idx]=val===''?null:val;save();let n=document.querySelector('.stepbar .small:last-child');if(n)n.textContent='已答 '+currentAnswered()+'/15'}});
try{let old=localStorage.getItem(KEY);if(old){let x=JSON.parse(old);if(x&&[0,1].includes(x.paper)&&x.answers?.length===15&&typeof x.end==='number'){exam=x}}}catch(e){};
if(exam){if(exam.done)results();else if(Date.now()>=exam.end)finish(true);else{renderQ();runTimer()}}else mainPage();
</script></body></html>
